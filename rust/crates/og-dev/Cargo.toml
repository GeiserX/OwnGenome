[package]
name = "og-dev"
description = "og dev: the developer and CI verbs: parity-compare, contract, schema, report-only, build, scans and version checks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Only the CI red control enables this fault. Normal builds keep it off.
[features]
planted-ci-reader = []

[dependencies]
pycompat.workspace = true
og-io.workspace = true
og-nf.workspace = true
og-runlog.workspace = true
og-summary.workspace = true
og-intervals.workspace = true
og-browser.workspace = true
og-setup.workspace = true
flate2.workspace = true
indexmap.workspace = true
png = "0.18"
sha2 = "0.11"
rustix.workspace = true
fancy-regex = "=0.16.2"
regex-syntax = "=0.8.11"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }

[lints]
workspace = true
