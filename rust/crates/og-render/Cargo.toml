[package]
name = "og-render"
description = "og report render|index|charts: the HTML and text reports, the run's search index and the chart specs, from summary.json"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Planted faults: each one breaks one rule of the report on purpose, and the
# test of tests/port_report_core.rs that guards the rule must fail with it
# (the controls in .github/workflows/guard.yml).
fault-new-since-text-qc = []
fault-new-since-html-badge = []
fault-escape-apos-39 = []

[dependencies]
pycompat.workspace = true
og-io.workspace = true
og-lookup.workspace = true
og-summary.workspace = true
indexmap.workspace = true

[dev-dependencies]
# The PGx tests validate their summaries with og dev schema's rule.
og-dev.workspace = true
# The ancestry chapter's tests (tests/ancestry_*.rs) run each step's own
# verb, then collect and render its result, as the run does.
og-ancestry.workspace = true
og-reports.workspace = true
flate2.workspace = true

[lints]
workspace = true
