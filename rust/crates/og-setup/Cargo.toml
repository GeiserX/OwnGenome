[package]
name = "og-setup"
description = "What scripts/setup.sh runs once per install: og setup install, fetch, source, path, plan and prune, og str catalog, og setup unzip, genetic-map, megane-kmers and revel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
md-5 = "0.11"
sha2 = "0.11"
rustix = { workspace = true, features = ["fs", "process"] }
signal-hook.workspace = true
pycompat.workspace = true
og-io.workspace = true
og-intervals.workspace = true
og-filters.workspace = true
flate2.workspace = true
zlib-rs.workspace = true
indexmap.workspace = true

[dev-dependencies]
# Only for the test that forms() agrees with og str motif's; the library
# stays free of htslib, so an og built without BAM support can link it.
og-bam.workspace = true

[lints]
workspace = true
