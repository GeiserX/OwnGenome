[package]
name = "og-steps"
description = "The helpers of the step scripts and modules, one module per tool: constraint, the gnomAD gene constraint join; prs, the PGS Catalog scores as pgsc_calc reads them; consumer, step 40's raw-data export; family, step 38's family analysis; pgx_rules and pypgx_summary, steps 36 and 32; paraphase, step 35b; sv, step 05's SV callers into AnnotSV and the class 4-5 checks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# A planted fault: the rules table the tests of tests/genome_traits.rs read
# carries WRONG_REFERENCE as two reference-block labels, and those two tests
# must fail (the control in .github/workflows/guard.yml).
fault-wrong-reference = []

[dependencies]
pycompat.workspace = true
og-io.workspace = true
og-filters.workspace = true
og-setup.workspace = true
og-intervals.workspace = true
flate2.workspace = true
memchr.workspace = true
indexmap.workspace = true
og-pedigree.workspace = true
og-vcf.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
zlib-rs.workspace = true

[lints]
workspace = true

[dev-dependencies]
# tests/family_report.rs reads a written pedigree back as the live family
# page does (og live family state).
og-live.workspace = true
