name: Demo pictures

# Retakes the three docs pictures of DEMO-001, the invented sample
# (docs/testing.md, "Retaking the report pictures"), with
# tests/demo/retake-screenshots.sh: it writes the sample from a fixed seed
# (og dev demo-sample), runs steps 36, 27, 24 and 28 on it with the pinned
# images, draws the pictures in the runner's Chrome (og dev pictures take) and
# checks them: the text each one shows, its PNG chunks, and the same Total
# variants as the live-site demo. The pictures come back as the artifact
# `demo-pictures`; look at them and commit them into docs/images/ by hand.
# Nothing here writes to the repository.
#
# The job live-picture takes docs/images/demo-live-site.png and
# docs/images/demo-live-phone.png (docs/live-site.md) with og dev pictures
# live: the live-site demo as the docs workflow publishes it, built by
# og live demo on a DEMO-001 of its own, with no container,
# and its partner page on a 390 px phone. Both come back as the artifact
# `demo-live-picture`.
#
# On pull requests it runs only when the picture tooling changes, so a change
# that breaks the script turns that pull request red. It is not a required
# check, so the paths filter cannot leave a pull request waiting.
#
# Public repo: GitHub-hosted runners are free here, and this runs on pull
# requests, so nothing in this file may use a self-hosted runner.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/demo/**'
      - 'tests/og_binary.py'
      # og dev demo-sample, which writes the sample the pictures show
      - 'rust/crates/og-dev/src/demo/**'
      - 'rust/crates/og-live/src/demo.rs'
      # og dev pictures, which takes and checks them, and its Chrome driver
      - 'rust/crates/og-dev/src/pictures.rs'
      - 'rust/crates/og-browser/src/**'
      - 'tests/fixtures/live/demo-001.weblog.jsonl'
      - 'tests/fixtures/live/demo/**'
      - '.github/workflows/demo-pictures.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retake:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The CPIC picture is drawn in DejaVu Sans Mono on Linux. The runner's
      # Google Chrome takes the pictures.
      - name: Font
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-dejavu-core

      # Step 27 runs og in its container (bin/og), and the script writes the
      # demo sample with the same bin/og (og dev demo-sample).
      - name: Build og as scripts/setup.sh --og does
        run: |
          scripts/setup.sh --og
          rust/og.sh check --required

      - name: Retake the pictures
        run: tests/demo/retake-screenshots.sh "$RUNNER_TEMP/demo" "$RUNNER_TEMP/pictures"

      - name: Upload the pictures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-pictures
          path: ${{ runner.temp }}/pictures/demo-*.png
          if-no-files-found: error
          retention-days: 7

  live-picture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Font
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-dejavu-core

      # og (rust/, docs/rust.md): the live-site demo writes its sample with
      # og dev demo-sample, which runs step 27's og pgx cpic-report, step 33's
      # og qc sex-loss and the other verbs of the steps it stands in for
      # (OG names the og).
      - name: Install the toolchain rust/rust-toolchain.toml pins
        working-directory: rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: Build og
        working-directory: rust
        run: |
          OG_TREE_HASH=$(./og.sh tree-hash) cargo build --release --locked -p og
          echo "OG=${PWD}/target/release/og" >> "$GITHUB_ENV"

      # The site is built as docs.yml builds it; og dev pictures live takes
      # both pictures in the runner's Google Chrome and checks the phone one is
      # 390 px wide.
      - name: Take the live-site pictures
        run: |
          "$OG" live demo --out "$RUNNER_TEMP/site"
          "$OG" dev pictures live --site "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/pictures"
          "$OG" dev pictures live --site "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/pictures" --phone
          "$OG" dev pictures check --self-test
          "$OG" dev pictures check "$RUNNER_TEMP/pictures/demo-live-site.png" \
            "$RUNNER_TEMP/pictures/demo-live-phone.png"

      - name: Upload the pictures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-live-picture
          path: ${{ runner.temp }}/pictures/demo-live-*.png
          if-no-files-found: error
          retention-days: 7
