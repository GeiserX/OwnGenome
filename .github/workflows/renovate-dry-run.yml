name: Renovate dry run

# Runs Renovate's lookups on this repository with no app, no write access and
# no branch or PR created (local platform, dry-run=lookup), then checks what
# it found. The hosted Renovate app reads the same renovate.json, so a
# matcher that misses an image, or a versioning that cannot read a tag, shows
# up here first. The full debug log is kept as an artifact for 14 days.
#
# The checks (og dev renovate-check; each one has a planted fault in its
# self-test, which runs after the checks):
#   count    every *_IMAGE line of versions.env is a detected docker dependency
#   names    no package name carries a ':' or '@' (a digest line once became
#            a package named '...@sha256')
#   twins    docs/versions.md holds exactly the images of versions.env, and
#            conf/containers.config holds only those, so one Renovate PR
#            updates every copy
#   one-pr   a tool gets the same proposal in every file it is in
#   pins     every non-image pin (Nextflow, actionlint, gitleaks, ShellCheck,
#            the Renovate CLI, the HLA database, pgsc_calc, the demo's Python
#            packages, Aldy, the docs workflow's Python; one row each in
#            scripts/ci/renovate-pins.tsv) is detected in every place it is
#            pinned, as often as the text has them. A setup-nextflow step
#            counts as a pin only when its version: line is a literal
#            version, quoted or not; a computed one (an expression) is not a pin
#   lookups  no lookup failed and no tag was unreadable; the only skipped
#            dependencies are the ones a rule in renovate.json disables
# The step summary lists every dependency with the update Renovate would
# propose, or the reason it proposes none.
#
# The versions-doc job checks that docs/versions.md is what
# scripts/ci/gen-versions-doc.sh writes from versions.env.
on:
  # Every file a manager in renovate.json reads (the workflows hold the
  # Nextflow, actionlint, gitleaks, ShellCheck, Renovate and docs Python pins,
  # the docs the NXF_VER lines and the Aldy pin, scripts/lib/common.sh the HLA
  # database, the demo script its Python packages), plus the doc generator,
  # the pins table and the checker.
  # The lookups take about a minute.
  pull_request:
    branches: [main]
    paths:
      - 'renovate.json'
      - 'versions.env'
      - 'conf/containers.config'
      - 'docs/*.md'
      - '.github/workflows/**'
      - 'scripts/ci/gen-versions-doc.sh'
      - 'scripts/ci/renovate-pins.tsv'
      - 'rust/crates/og-dev/src/renovate.rs'
      - 'scripts/lib/common.sh'
      - 'tests/demo/retake-screenshots.sh'
  push:
    branches: [main]
    paths:
      - 'renovate.json'
      - '.github/workflows/renovate-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A Renovate PR edits versions.env and the same string in the generated
  # files; the hosted app cannot run the generators. Guard checks
  # conf/containers.config; this job checks docs/versions.md and, when it is
  # stale, prints the command to run on the branch.
  versions-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-test (a tag changed only in versions.env must be caught)
        run: |
          t="${RUNNER_TEMP}/stale"
          mkdir -p "${t}/scripts/ci" "${t}/docs"
          cp scripts/*.sh "${t}/scripts/"
          cp scripts/ci/gen-versions-doc.sh "${t}/scripts/ci/"
          cp versions.env "${t}/"
          cp docs/versions.md "${t}/docs/"
          sed -i.bak -E 's|^(BCFTOOLS_IMAGE="[^"]*:)[^"]*"|\19.99"|' "${t}/versions.env"
          rc=0
          out=$("${t}/scripts/ci/gen-versions-doc.sh" --check 2>&1) || rc=$?
          if [ "$rc" -ne 1 ] || ! grep -q 'run scripts/ci/gen-versions-doc.sh' <<<"$out"; then
            printf '%s\n' "$out"
            echo "FAIL: --check exited ${rc} on a stale docs/versions.md without naming the command"
            exit 1
          fi
          echo "self-test caught: $(tail -n1 <<<"$out")"

      - name: docs/versions.md is what versions.env produces
        run: scripts/ci/gen-versions-doc.sh --check

  lookup:
    # Public repo: GitHub-hosted runners only.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RENOVATE_VERSION: 44.199.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Renovate
        run: npm install --global --no-audit --no-fund "renovate@${RENOVATE_VERSION}"

      - name: Validate renovate.json (strict, so a config that needs migration fails)
        id: validate
        run: renovate-config-validator --strict renovate.json

      # The lookups and the checks run even when validation failed, so one red
      # run names every problem.
      - name: Renovate lookups (local platform, dry run)
        id: lookup
        if: ${{ !cancelled() }}
        env:
          LOG_LEVEL: debug
          LOG_FORMAT: json
          # Read-only token, so the github-releases lookups are not rate limited.
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: renovate --platform=local --dry-run=lookup > "${RUNNER_TEMP}/renovate.log"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: renovate-dry-run-log
          path: ${{ runner.temp }}/renovate.log
          retention-days: 14

      # The checks are og dev renovate-check (rust/crates/og-dev/src/renovate.rs),
      # with the non-image pins in scripts/ci/renovate-pins.tsv.
      - name: Build og as scripts/setup.sh --og does
        if: ${{ !cancelled() && steps.lookup.outcome == 'success' }}
        run: |
          scripts/setup.sh --og
          rust/og.sh check --required

      - name: Check what Renovate found
        if: ${{ !cancelled() && steps.lookup.outcome == 'success' }}
        run: bin/og dev renovate-check "${RUNNER_TEMP}/renovate.log"
