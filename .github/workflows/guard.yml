name: Guard

# Checks that run the pipeline's own code, on every pull request with no
# path filter, so a change anywhere cannot skip them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-vars:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test (a planted undefined variable must be caught)
        run: scripts/ci/check-image-vars.sh --self-test

      - name: Every *_IMAGE a script uses is defined
        run: scripts/ci/check-image-vars.sh

  # The one image check: no file names an image outside versions.env, and the
  # two files generated from it (conf/containers.config, docs/versions.md)
  # are up to date. Each script's self-test plants its faults first.
  images:
    needs: og
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The scans and the run-versions check are og dev verbs
      # (rust/crates/og-dev): the og the og job built.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: og-unit-tests
          path: ${{ runner.temp }}/og

      - name: og for the checks (OG)
        run: |
          chmod 755 "$RUNNER_TEMP/og/og"
          echo "OG=${RUNNER_TEMP}/og/og" >> "$GITHUB_ENV"

      - name: Self-test (a literal image in a script, module, workflow or doc, a stale exemption, a process with no selector and a stale generated file must be caught)
        run: scripts/ci/check-images.sh --self-test

      - name: Self-test of the containers.config generator (a stale tag, a missing or stray selector, a module's own container and a wrong version must be caught)
        if: ${{ !cancelled() }}   # runs even when a step above failed, so each result shows
        run: scripts/ci/gen-containers-config.sh --self-test

      - name: No file names an image outside versions.env; generated files are up to date
        if: ${{ !cancelled() }}   # runs even when a step above failed, so each result shows
        run: scripts/ci/check-images.sh

  coupled-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test (a VEP cache, pypgx bundle, AnnotSV or Yleaf data version, GENCODE release or VerifyBamID panel that left its image, and a lone PCGR variable, must be caught)
        run: scripts/ci/check-coupled-versions.sh --self-test

      - name: Each data version in versions.env matches the image it belongs to
        if: ${{ !cancelled() }}   # runs even when a step above failed, so each result shows
        run: scripts/ci/check-coupled-versions.sh

  # MITO_HAPLOGROUP runs haplogrep3 in its Nextflow task directory: the
  # pinned build finds its config and trees beside its jar, and the report
  # must land where Nextflow collects it. A `cd` or a `readlink -f` in that
  # process would bring back the run in the binary's directory, which can be
  # read-only. Only that process is checked: the readlink -f of the
  # reference in MITO_EXTRACT_CHRM, in the same file, is right.
  mito-workdir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The self-test plants its faults first: a cd or readlink -f in
      # MITO_HAPLOGROUP, or a renamed process, must be caught; a cd in
      # MITO_EXTRACT_CHRM must not. Then the module itself.
      - name: MITO_HAPLOGROUP has no cd and no readlink -f (self-test first)
        run: |
          set -euo pipefail
          # check FILE: exit 1 and name each line when the MITO_HAPLOGROUP
          # block (from its process line to the closing brace at column 1)
          # has a cd or a readlink -f outside a comment, or when the file has
          # no such block.
          check() {
            awk '
              /^process MITO_HAPLOGROUP[[:space:]]*\{/ { p = 1; seen = 1; next }
              p && /^\}/ { p = 0 }
              p && !/^[[:space:]]*#/ && (/(^|[^[:alnum:]_.-])cd([[:space:]]|$)/ || /readlink[[:space:]]+-f/) {
                print FILENAME ":" FNR ": " $0; bad = 1
              }
              END {
                if (!seen) { print FILENAME ": no process MITO_HAPLOGROUP"; exit 1 }
                exit bad
              }' "$1"
          }
          M=modules/local/mito_haplogroup/main.nf
          T=$(mktemp -d)
          # plant NAME SED: a copy of the module with one edit; the edit must
          # change the file, or the control would test the module itself.
          plant() {
            sed "$2" "$M" > "${T}/$1.nf"
            if cmp -s "$M" "${T}/$1.nf"; then echo "FAIL: the plant $1 changed nothing"; exit 1; fi
          }
          # shellcheck disable=SC2016  # the planted lines are text, never expanded here
          plant cd '/^process MITO_HAPLOGROUP/,/^}/ s|^    haplogrep3 classify|    cd "$(dirname "$(command -v haplogrep3)")"\n    haplogrep3 classify|'
          # shellcheck disable=SC2016  # as above
          plant readlink '/^process MITO_HAPLOGROUP/,/^}/ s|^    haplogrep3 classify|    BIN=$(readlink -f "$(command -v haplogrep3)")\n    haplogrep3 classify|'
          plant renamed 's/^process MITO_HAPLOGROUP /process MITO_HAPLOGROUP_X /'
          plant chrm-cd '/^process MITO_EXTRACT_CHRM/,/^}/ s|^    { echo ">chrM"|    cd .\n    { echo ">chrM"|'
          for c in cd readlink renamed; do
            if out=$(check "${T}/${c}.nf"); then
              echo "FAIL: the planted ${c} was not caught"; exit 1
            fi
            echo "caught ${c}: ${out}"
          done
          out=$(check "${T}/chrm-cd.nf") || { echo "FAIL: a cd in MITO_EXTRACT_CHRM was taken for MITO_HAPLOGROUP, or the module already fails:"; echo "$out"; exit 1; }
          echo "OK: every plant in MITO_HAPLOGROUP is caught, and MITO_EXTRACT_CHRM is left alone"
          check "$M"
          echo "OK: MITO_HAPLOGROUP runs haplogrep3 in its task directory"

  fake-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # generate-report.sh runs og run delta, and the run-state case runs og
      # run state, so the cases need og in bin/.og, stamped with this
      # checkout's rust/ tree so run-all.sh's stale-binary check passes. One
      # host build is enough: the fake docker runs og on the host.
      - name: Install the toolchain rust/rust-toolchain.toml pins
        working-directory: rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - name: Build og into bin/.og
        working-directory: rust
        run: |
          OG_TREE_HASH=$(./og.sh tree-hash) cargo build --release --locked -p og
          mkdir -p ../bin/.og
          cp target/release/og "../bin/.og/og-linux-$(uname -m)"
          ./og.sh check
          ../bin/og version

      - name: Self-test (a swallowed empty image, an unknown option and a failing case must be caught)
        run: scripts/ci/run-fake-docker-suite.sh --self-test

      - name: setup.sh, validate-setup.sh and run-all.sh against a fake docker
        run: scripts/ci/run-fake-docker-suite.sh

  # The helper table is og dev helpers (scripts/ci/check-container-helpers.sh
  # runs it), so this job takes the og the og job builds.
  helper-binaries:
    needs: og
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: og-unit-tests
          path: ${{ runner.temp }}/og

      - name: og for the helper table (OG)
        run: |
          chmod 755 "$RUNNER_TEMP/og/og"
          echo "OG=${RUNNER_TEMP}/og/og" >> "$GITHUB_ENV"

      - name: Self-test (planted bgzip/tabix calls behind if !, time and VAR=, and an orad option orad does not list, must be caught)
        run: scripts/ci/check-container-helpers.sh --self-test

      # tests/test_exec_bits.sh (unit-tests) plants a helper without the bit.
      - name: Every bin/ helper the pipeline calls by name is executable
        run: scripts/ci/check-exec-bits.sh

      - name: Table of helper calls derived from scripts and modules
        if: ${{ !cancelled() }}   # runs even when a step above failed, so each result shows
        run: scripts/ci/check-container-helpers.sh --list

      - name: Each helper binary exists in the image that calls it
        run: scripts/ci/check-container-helpers.sh

      - name: Every option step 01 passes to orad is in the pinned orad's --help
        if: ${{ !cancelled() }}   # runs even when a step above failed, so each result shows
        run: scripts/ci/check-container-helpers.sh --orad

  # og for the unit tests (tests/og_binary.py): the tests of a ported tool
  # and the demo sample builder run og as a subprocess. Built once here, so
  # the three shards do not each spend minutes of their 10 on it. The images
  # job runs its og dev scans with it too.
  og:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain rust/rust-toolchain.toml pins
        working-directory: rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - name: Build og
        working-directory: rust
        run: OG_TREE_HASH=$(./og.sh tree-hash) cargo build --release --locked -p og

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: og-unit-tests
          path: rust/target/release/og
          if-no-files-found: error
          retention-days: 1

  # Three shards: one job ran every test file in about 9.5 of its 10 minutes,
  # so each new browser test pushed it over. File i runs in shard i % 3, so
  # every file runs in exactly one shard. The limit is 25 minutes: the shard
  # that holds the browser tests of the live page takes about 13, and
  # test_live_demo.py alone takes about 12 of those, so no split of files
  # between shards brings it under 15.
  unit-tests:
    needs: og
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: og-unit-tests
          path: ${{ runner.temp }}/og

      - name: og for the tests (OG)
        run: |
          chmod 755 "$RUNNER_TEMP/og/og"
          echo "OG=${RUNNER_TEMP}/og/og" >> "$GITHUB_ENV"

      # Every tests/test_*.py runs with python3 and every tests/test_*.sh with
      # bash, found by glob, so a new test file needs no workflow edit. The
      # two planted failures prove the loop reports a failing test.
      - name: Run this shard's tests/test_*.py and tests/test_*.sh
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 3
        run: |
          # run_tests DIR [SHARD SHARDS]: run the test files of DIR, or only
          # those whose position in the sorted list is SHARD modulo SHARDS.
          run_tests() {
            local dir=$1 shard=${2:-0} shards=${3:-1} t rc i=0 n=0 fail=0
            shopt -s nullglob
            for t in "$dir"/test_*.py "$dir"/test_*.sh; do
              i=$((i + 1))
              [ $(( (i - 1) % shards )) -eq "$shard" ] || continue
              n=$((n + 1))
              rc=0
              echo "::group::${t}"
              case "$t" in
                *.py) python3 "$t" || rc=$? ;;
                *.sh) bash "$t" || rc=$? ;;
              esac
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then echo "PASS ${t}"; else echo "FAIL ${t} (exit ${rc})"; fail=1; fi
            done
            if [ "$n" -eq 0 ]; then echo "ERROR: no test files in ${dir}"; return 1; fi
            echo "Ran ${n} of ${i} test files in ${dir}."
            return "$fail"
          }

          ctl=$(mktemp -d)
          mkdir "${ctl}/py" "${ctl}/sh"
          echo 'assert False, "planted failure"' > "${ctl}/py/test_planted.py"
          echo 'exit 1' > "${ctl}/sh/test_planted.sh"
          for d in "${ctl}/py" "${ctl}/sh"; do
            if run_tests "$d"; then
              echo "ERROR: a planted failing test in ${d} was reported as passing"
              exit 1
            fi
          done
          echo "Control: both planted failures were reported."

          run_tests tests "$SHARD" "$SHARDS"

  # OwnGenome's Rust code (rust/, docs/rust.md), in a job of its own:
  # unit-tests is close to its 10 minutes. Format, lint, unit tests with a
  # planted failure that must go red, pycompat against CPython, then the two
  # musl builds as scripts/setup.sh --og makes them and the stale-binary
  # guard on the real binaries. It took 15 to 18 minutes on a free runner and
  # 23 on main on 2026-11-18, and the same tree on the geiresx fork ran past
  # 30 twice, so the limit is 45: it stops a hung job, not a slow one.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep Python 3.9's regex cases and the newer Unicode tables available. The
      # scanner fails closed on version-dependent scalars; span iteration
      # intentionally uses Python 3.14+ semantics for empty-text \B.
      # Standalone builds also provide Python 3.9 on newer ubuntu-latest
      # images where actions/setup-python has no matching distribution.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.18'
          enable-cache: false

      - name: Install all three Unicode oracle interpreters
        run: |
          uv python install --no-bin 3.9 3.12 3.15
          interpreters=""
          for version in 3.9 3.12 3.15; do
            python=$(uv python find --managed-python "$version")
            "$python" -I -c 'import sys,unicodedata; print(sys.version.split()[0],unicodedata.unidata_version)'
            interpreters="${interpreters:+$interpreters:}$python"
          done
          echo "PERSONAL_DATA_PYTHONS=$interpreters" >> "$GITHUB_ENV"
          echo "PERSONAL_DATA_REQUIRE_PYTHONS=3.9:3.12:3.15" >> "$GITHUB_ENV"
          # Span iteration intentionally follows the newest interpreter.
          dirname "$python" >> "$GITHUB_PATH"

      - name: Install the toolchain rust/rust-toolchain.toml pins, with rustfmt and clippy
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal -c rustfmt -c clippy
          rustc --version

      # The one Guard job a cache speeds up (clippy and the tests, 1 to 2
      # minutes). It saves on main only: a branch reads main's entry, and the
      # per-branch entries of every job filled the 10 GB the E2E image and
      # data caches need. The jobs that only build og --release have no
      # cache: it did not make that build faster.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy, warnings are errors
        if: ${{ !cancelled() }}   # runs even when a step above failed, so each result shows
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Control (the planted failing test must fail, and be the test that failed)
        run: |
          log="${RUNNER_TEMP}/planted.log"
          if cargo test --locked -p pycompat --features planted-failure planted_failure > "$log" 2>&1; then
            cat "$log"
            echo "ERROR: the planted failing test passed: the test run would report a broken test as green"
            exit 1
          fi
          grep -E 'planted_failure.*FAILED' "$log" || { cat "$log"; echo "ERROR: the run failed, but not on the planted test"; exit 1; }
          echo "Control: the planted test failed, as it must."

      - name: Control (archaic duplicate window must fail when equal positions are split)
        run: |
          source=crates/og-ancestry/src/archaic.rs
          saved=$(mktemp "${RUNNER_TEMP}/archaic-window.XXXXXX")
          cp "$source" "$saved"
          trap 'cp -f "$saved" "$source"; rm -f "$saved"' EXIT
          sed 's/r.pos == kept.pos/r.pos < kept.pos/' "$saved" > "$source"
          grep -q 'r.pos < kept.pos' "$source"
          log="${RUNNER_TEMP}/archaic-window-red.log"
          if cargo test --locked --no-fail-fast -p og-ancestry duplicate_window_keeps_only_one_record_of_lookahead > "$log" 2>&1; then
            cat "$log"
            echo "ERROR: splitting a duplicate-position window passed"
            exit 1
          fi
          cat "$log"
          grep -E 'duplicate_window_keeps_only_one_record_of_lookahead.*FAILED' "$log"
          echo "Control: splitting the window failed its regression test."

      - name: Control (an unreadable PharmCAT report reported as success must fail)
        run: |
          log="${RUNNER_TEMP}/ci-reader-control.log"
          rc=0
          cargo test --locked --no-fail-fast -p og-dev --features planted-ci-reader --test ci_readers \
            unreadable_pharmcat_is_unassessed > "$log" 2>&1 || rc=$?
          cat "$log"
          [ "$rc" -ne 0 ] || { echo "ERROR: the planted unreadable-report success passed"; exit 1; }
          grep -E 'unreadable_pharmcat_is_unassessed.*FAILED' "$log"
          echo "Control: the unreadable-report success was reported as a failed test."
      # The live ops card (og-live/tests/ops*.rs): each planted_* test turns
      # on one planted mistake of the fault-inject feature, so every one of
      # them must fail, and none may pass.
      - name: Control (every planted mistake of the live ops card must fail its check)
        run: |
          set -o pipefail
          tests=(--test ops --test ops_eta --test ops_headroom)
          log="${RUNNER_TEMP}/ops-planted.log"
          want=$(cargo test --locked -p og-live --features fault-inject "${tests[@]}" planted_ -- --list 2>/dev/null \
            | grep -cE '^planted::planted_[a-z0-9_]+: test$' || true)
          [ "$want" -gt 0 ] || { echo "ERROR: no planted test was found"; exit 1; }
          rc=0
          cargo test --locked --no-fail-fast -p og-live --features fault-inject "${tests[@]}" planted_ > "$log" 2>&1 || rc=$?
          grep -E '^test planted::planted_' "$log" || true
          [ "$rc" -ne 0 ] || { cat "$log"; echo "ERROR: every planted mistake passed"; exit 1; }
          passed=$(grep -E '^test planted::planted_[a-z0-9_]+ \.\.\. ok$' "$log" || true)
          [ -z "$passed" ] || { echo "ERROR: a check passed with its planted mistake on:"; echo "$passed"; exit 1; }
          failed=$(grep -cE '^test planted::planted_[a-z0-9_]+ \.\.\. FAILED$' "$log" || true)
          [ "$failed" -eq "$want" ] || { cat "$log"; echo "ERROR: ${want} planted tests, ${failed} failed"; exit 1; }
          echo "Control: all ${failed} planted mistakes of the live ops card failed their checks."
      - name: Report frame controls (each planted fault of og-render must fail its test)
        run: |
          for pair in fault-new-since-text-qc:the_text_quality_block_carries_the_badge_when_coverage_changed \
                      fault-new-since-html-badge:the_badge_sits_only_on_the_section_whose_result_changed \
                      fault-escape-apos-39:summary_text_is_escaped_in_the_page; do
            fault=${pair%%:*}; test=${pair#*:}
            log="${RUNNER_TEMP}/${fault}.log"
            if cargo test --locked --no-fail-fast -p og-render --features "$fault" --test port_report_core > "$log" 2>&1; then
              cat "$log"
              echo "ERROR: og-render built with ${fault} passed its tests"
              exit 1
            fi
            grep -E "^test ${test} .*FAILED" "$log" || { cat "$log"; echo "ERROR: ${fault} did not fail ${test}"; exit 1; }
            echo "Control: ${fault} failed ${test}, as it must."
          done
      # The reference-block labels of the multi-SNP rules are written in the
      # test, not read from the rules table: with WRONG_REFERENCE planted as
      # the label of APOL1 G0/G0 and CAD9p21 nonrisk/nonrisk, exactly those
      # two tests must fail.
      - name: Control (a changed reference-block label fails its independent expectation)
        run: |
          log="${RUNNER_TEMP}/wrong-reference.log"
          rc=0
          cargo test --locked --no-fail-fast -p og-steps --features fault-wrong-reference --test genome_traits \
            > "$log" 2>&1 || rc=$?
          cat "$log"
          [ "$rc" -ne 0 ] || { echo "ERROR: the planted WRONG_REFERENCE labels passed"; exit 1; }
          for test in reference_blocks_apol1 reference_blocks_cad9p21; do
            grep -E "^test ${test} \.\.\. FAILED$" "$log" || { echo "ERROR: ${test} did not catch WRONG_REFERENCE"; exit 1; }
          done
          grep -E 'test result: FAILED\. [0-9]+ passed; 2 failed;' "$log" \
            || { echo "ERROR: a test other than the two planted ones failed"; exit 1; }
          echo "Control: WRONG_REFERENCE failed reference_blocks_apol1 and reference_blocks_cad9p21."
      - name: Traits controls (diplotype order, REF check and missing phase rows)
        env:
          CARGO_BUILD_JOBS: 3
        run: |
          src=crates/og-steps/src/traits.rs
          saved="${RUNNER_TEMP}/traits.rs"
          log="${RUNNER_TEMP}/traits-controls.log"
          cp -f "$src" "$saved"
          trap 'cp -f "$saved" "$src"' EXIT
          perl -0pi -e 's/(fn allowed\b.*?)(\n    out\n)/$1\n    out.reverse();$2/s; s/if c\[2\]\.chars\(\)\.next\(\) != s\.row\["ref"\]\.chars\(\)\.next\(\)/if c[2].is_empty()/; s/(fn phase_vcf\b.*?)(    let mut out = AtomicFile::create\(path\))/$1    sites.clear();\n$2/s' "$src"
          cmp -s "$saved" "$src" && { echo "ERROR: no traits control was planted"; exit 1; }
          if cargo test --locked -p og-steps traits::tests --no-fail-fast > "$log" 2>&1; then
            cat "$log"
            echo "ERROR: traits accepted the planted faults"
            exit 1
          fi
          cat "$log"
          for test in apoe_grid_keeps_haplotype_order_and_missing_calls stream_prefers_first_snv_but_checks_every_ref_and_bounds_memory phase_requires_one_block_and_only_multiple_hets_are_exported; do
            grep -E "traits::tests::${test} .*FAILED" "$log" || { echo "ERROR: $test did not catch its fault"; exit 1; }
          done
          cp -f "$saved" "$src"
          trap - EXIT

      # The PGx tests moved from Python into cargo test: each planted fault must
      # fail the moved test that guards that rule (one per new test target).
      - name: PGx test controls (a planted fault fails its moved test in each crate)
        run: |
          files="crates/og-steps/src/pgx_rules.rs crates/og-pgx/src/sections.rs crates/og-filters/src/mito.rs crates/og-filters/src/refblock.rs crates/og-bam/tests/data/parity/want/check-multimapped_with_alt/files/check.tsv"
          saved="${RUNNER_TEMP}/pgx-controls"
          mkdir -p "$saved"
          for f in $files; do cp -f "$f" "$saved/$(basename "$f")"; done
          trap 'for f in $files; do cp -f "$saved/$(basename "$f")" "$f"; done' EXIT
          # plant FILE EXPR: apply one fault and fail if it changed nothing.
          plant() {
            cp -f "$1" "${RUNNER_TEMP}/pgx-before"
            perl -pi -e "$2" "$1"
            cmp -s "$1" "${RUNNER_TEMP}/pgx-before" && { echo "ERROR: no fault was planted in $1: $2"; exit 1; }
            return 0
          }
          plant crates/og-steps/src/pgx_rules.rs 's/\} else if !same_pair\(&names, calls\) \{/} else if false \&\& !same_pair(\&names, calls) {/'
          plant crates/og-steps/src/pgx_rules.rs 's/if !same_diplotype\(&pg, &cy\.0\) \{/if same_diplotype(\&pg, \&cy.0) {/'
          plant crates/og-pgx/src/sections.rs 's/cyp2d6_band\(all\[0\] \* factor\)/cyp2d6_band(all[0])/'
          plant crates/og-pgx/src/sections.rs 's/STEP36_GENES\.contains\(&c\.gene\.as_str\(\)\) && !confirmed \{/STEP36_GENES.contains(\&c.gene.as_str()) \&\& false \&\& !confirmed {/'
          plant crates/og-filters/src/mito.rs 's/^pub const MIN_AF: f64 = 0\.05;/pub const MIN_AF: f64 = 0.06;/'
          plant crates/og-filters/src/refblock.rs 's/^pub const MIN_GQ: i128 = 20;/pub const MIN_GQ: i128 = 19;/'
          plant crates/og-bam/tests/data/parity/want/check-multimapped_with_alt/files/check.tsv 's/^status\tunreliable$/status\tok/'
          log="${RUNNER_TEMP}/pgx-controls.log"
          if cargo test --locked --no-fail-fast -p og-steps -p og-pgx -p og-filters -p og-bam \
              --test pgx_hla_second_caller --test port_tests_pgx_cpic --test port_tests_pgx_mito \
              --test port_tests_pgx_refblock --test cyp2d6_depth --test pgx_outside_calls \
              --test port_tests_pgx_outside > "$log" 2>&1; then
            cat "$log"
            echo "ERROR: the moved PGx tests passed with the planted faults"
            exit 1
          fi
          cat "$log"
          for test in case2_optitype_disagrees_at_hla_b a_moderate_inhibitor_halves_the_activity_score \
              case2_the_af_bound the_gq_threshold each_depth_table_gives_its_verdict_and_the_shares \
              case3_both_agree_and_the_depth_check_passed case10_a_stale_report; do
            grep -E "^test ${test} .*FAILED" "$log" || { echo "ERROR: $test did not catch its fault"; exit 1; }
          done
          echo "Control: each planted PGx fault failed the moved test that guards it."

      - name: Control (ROH scope and neutral hints reject planted faults)
        run: |
          reader=crates/og-summary/src/collect/group_c/roh.rs
          table=../assets/imprinted_regions.tsv
          cp "$reader" "$RUNNER_TEMP/roh-reader.rs"
          cp "$table" "$RUNNER_TEMP/imprinted-regions.tsv"
          restore_roh() {
            cp "$RUNNER_TEMP/roh-reader.rs" "$reader"
            cp "$RUNNER_TEMP/imprinted-regions.tsv" "$table"
          }
          trap restore_roh EXIT
          sed -i 's/let denominator = covered_unmasked_bp(&covered);/let denominator = autosome_unmasked_bp();/' "$reader"
          sed -i 's/s("-")/s("Example syndrome")/g' "$reader"
          sed -i 's/26248010;29959430/not-pmid/' "$table"
          log="$RUNNER_TEMP/roh-scope-planted.log"
          rc=0
          cargo test --locked -p og-summary --no-fail-fast > "$log" 2>&1 || rc=$?
          cat "$log"
          test "$rc" -ne 0
          for name in \
            roh_scope_chr20_uses_its_own_unmasked_denominator \
            roh_scope_counts_sites_without_runs_and_keeps_partial_labels_empty \
            roh_scope_a_segment_only_file_never_establishes_scope \
            roh_scope_upd_is_a_region_hint_without_syndrome_names \
            imprinted_asset_is_the_only_table; do
            grep -E "test .*${name} .* FAILED" "$log"
          done
          grep -E 'test result: FAILED\. [0-9]+ passed; 5 failed;' "$log"
          restore_roh
          trap - EXIT

      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

      # The output contract keeps every stable row of the newest 1.x release
      # (docs/output-contract.md, "How CI holds it"). Release tags live on the
      # upstream repository, so a run on a fork reads them there too. Before
      # the first 1.x tag there is nothing to compare with; after it, a tag
      # that cannot be listed, fetched or read fails the step. The control
      # runs first: a baseline with a stable row this contract lacks must fail.
      - name: The contract keeps every stable row of the newest 1.x release
        env:
          RELEASES: https://github.com/GeiserX/OwnGenome.git
          MAJOR: '1'   # the release line this branch keeps; the 2.0 change sets 2
        run: |
          contract=../assets/output_contract.tsv
          planted="${RUNNER_TEMP}/contract-planted.tsv"
          log="${RUNNER_TEMP}/contract-baseline-red.log"
          { cat "$contract"; printf 'file\t{sample}/gone/{sample}_gone.tsv\t-\t-\tbash\ttsv\tstable\t-\t-\n'; } > "$planted"
          if cargo run --locked -q -p og -- dev contract --contract "$contract" --baseline "$planted" > "$log" 2>&1; then
            cat "$log"
            echo "ERROR: a stable row that is gone since the baseline passed"
            exit 1
          fi
          cat "$log"
          grep -F 'FAIL BREAKING: the stable file {sample}/gone/{sample}_gone.tsv' "$log"
          echo "Control: a stable row that is gone since the baseline failed."
          refs=$(git ls-remote --tags --refs "$RELEASES") || { echo "ERROR: could not list the tags of ${RELEASES}"; exit 1; }
          tag=$(printf '%s\n' "$refs" | sed -n "s|^[0-9a-f]*[[:space:]]*refs/tags/\(v${MAJOR}\.[0-9][0-9]*\.[0-9][0-9]*\)$|\1|p" | sort -V | tail -n 1)
          if [ -z "$tag" ]; then
            echo "No ${MAJOR}.x release tag on ${RELEASES} yet: no release contract to compare with."
            exit 0
          fi
          git fetch --no-tags --depth=1 "$RELEASES" "refs/tags/${tag}"
          base="${RUNNER_TEMP}/contract-${tag}.tsv"
          git show "FETCH_HEAD:assets/output_contract.tsv" > "$base"
          echo "Baseline: the contract of ${tag}"
          cargo run --locked -q -p og -- dev contract --contract "$contract" --baseline "$base"

      # The browser checks of og-browser (tests/browser/README.md) ran in
      # cargo test above, in the runner's Chrome. Two controls: a page error
      # planted in the clean page must fail its test, and with no Chrome the
      # tests must fail in CI and only skip outside it.
      - name: The browser checks fail on a planted page error, and without Chrome in CI
        if: ${{ !cancelled() }}
        run: |
          log="${RUNNER_TEMP}/og-browser-red.log"
          if cargo test --locked --no-fail-fast -p og-browser --features planted-page-error --test cdp > "$log" 2>&1; then
            cat "$log"
            echo "ERROR: the clean page's test passed with a planted page error"
            exit 1
          fi
          cat "$log"
          grep -E 'test a_clean_page_loads_with_no_page_error \.\.\. FAILED' "$log"
          grep -E "TypeError: .*\bplanted\b" "$log"
          echo "Control: a planted page error failed the clean page's test."
          if CHROME=/nonexistent cargo test --locked --no-fail-fast -p og-browser --test cdp > "$log" 2>&1; then
            cat "$log"
            echo "ERROR: the browser checks passed in CI without Chrome"
            exit 1
          fi
          cat "$log"
          grep -F "[FAIL] no Chrome or Chromium to load the test page" "$log"
          grep -E 'test a_clean_page_loads_with_no_page_error \.\.\. FAILED' "$log"
          grep -E 'test a_planted_exception_and_console_error_are_reported \.\.\. FAILED' "$log"
          echo "Control: without Chrome the browser checks fail in CI."
          CHROME=/nonexistent CI='' cargo test --locked -p og-browser --test cdp -- --nocapture > "$log" 2>&1 || { cat "$log"; exit 1; }
          cat "$log"
          test "$(grep -c -F '[SKIP] no Chrome or Chromium to load the test page' "$log")" -eq 2
          echo "Outside CI, without Chrome the browser checks skip."

      # og-io's root test (tests/atomic_root_owner.rs) skips unless it runs as
      # root: run it with sudo, then plant a writer that never reads NXF_OWNER
      # and check that the same test fails on it.
      - name: og-io as root hands its files to NXF_OWNER, and the test fails without the hand-over
        run: |
          root_test() {
            cargo test --locked -p og-io --test atomic_root_owner --no-run --message-format=json \
              | jq -r 'select(.executable != null) | .executable'
          }
          bin=$(root_test)
          test -x "$bin"
          sudo env OG_IO_ROOT_TEST=1 "$bin" --test-threads=1
          src=crates/og-io/src/lib.rs
          cp "$src" "${RUNNER_TEMP}/og-io-lib.rs"
          trap 'cp "${RUNNER_TEMP}/og-io-lib.rs" "$src"' EXIT
          sed -i 's/std::env::var("NXF_OWNER")/std::env::var("NXF_OWNER_PLANTED")/' "$src"
          grep -q 'NXF_OWNER_PLANTED' "$src" || { echo "ERROR: the break was not planted"; exit 1; }
          bin=$(root_test)
          log="${RUNNER_TEMP}/og-io-root-red.log"
          # The log is meant to be the runner's file, not root's.
          # shellcheck disable=SC2024
          if sudo env OG_IO_ROOT_TEST=1 "$bin" --test-threads=1 > "$log" 2>&1; then
            cat "$log"
            echo "ERROR: the root test passed with a writer that ignores NXF_OWNER"
            exit 1
          fi
          cat "$log"
          grep -F 'the file NXF_OWNER names an owner for' "$log"
          echo "Control: a writer that ignores NXF_OWNER failed the root test."

      # The planned-verb test (og/tests/port_scaffold.rs) must fail when a
      # later merge drops a verb's arm.
      - name: The planned-verb test fails when a verb is dropped
        run: |
          cp og/src/main.rs "${RUNNER_TEMP}/main.rs"
          trap 'cp "${RUNNER_TEMP}/main.rs" og/src/main.rs' EXIT
          sed -i '/Some("survivor-prep") =>/d' og/src/main.rs
          if grep -q 'survivor-prep") =>' og/src/main.rs; then echo "ERROR: the arm was not dropped"; exit 1; fi
          log="${RUNNER_TEMP}/planned-verbs-red.log"
          if cargo test --locked --no-fail-fast -p og --test port_scaffold > "$log" 2>&1; then
            cat "$log"
            echo "ERROR: the test passed with og sv survivor-prep dropped"
            exit 1
          fi
          cat "$log"
          grep -F "og sv survivor-prep: not routed" "$log"
          echo "Control: dropping og sv survivor-prep failed the planned-verb test."

      # Each pinned test-only commit still contains the scanner it attacks.
      - name: Scanner controls (both rounds must fail against their pre-fix code)
        run: |
          source=crates/og-dev/src/personal_data.rs
          matcher=crates/og-dev/src/lookaround.rs
          cp "$source" "${RUNNER_TEMP}/personal-data-fixed.rs"
