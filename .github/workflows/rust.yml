name: Rust

# The og binary in the images the tasks run. Guard holds the checks every
# pull request needs: its rust job (format, lint, tests, pycompat against
# the committed CPython answers), chrome job and og-musl job (the musl
# builds and the stale-binary guard). This workflow holds the slow one
# (docs/rust.md):
#
#   images   on a pull request that touches the Rust code, the shim or the
#            images: builds og with scripts/setup.sh --og, cold and then
#            cached (both times go to the summary), and runs it by bare name
#            in OG_IMAGE, PYTHON_IMAGE, BCFTOOLS_IMAGE, MANTA_IMAGE and
#            PARASCOPY_IMAGE on every platform each one publishes (arm64 under
#            QEMU). A second run with a planted wrong-arch binary must fail. The
#            two binaries are kept as the artifact og-binaries. Both also
#            run og-bam's fetch smoke on the fixture slice, against the reads
#            samtools in SAMTOOLS_IMAGE returns there.
#
# Public repo: GitHub-hosted runners only.
on:
  pull_request:
    branches: [main]
    paths:
      - 'rust/**'
      - 'bin/og'
      - 'tests/rust/**'
      - 'versions.env'
      - 'scripts/setup.sh'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build og with scripts/setup.sh --og, cold and cached
        run: |
          . versions.env
          docker pull -q "$OG_BUILDER" > /dev/null
          t0=$(date +%s); scripts/setup.sh --og; t1=$(date +%s)
          touch rust/og/src/main.rs
          scripts/setup.sh --og; t2=$(date +%s)
          rust/og.sh check --required
          {
            echo "| build | seconds |"
            echo "|---|---|"
            echo "| cold (empty cargo cache, image pulled) | $((t1 - t0)) |"
            echo "| cached (one crate changed) | $((t2 - t1)) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      # shell: bash sets pipefail, so a failing check is not masked by tee.
      - name: og by bare name in the task images, amd64 and arm64
        shell: bash
        run: tests/rust/og-in-images.sh | tee -a "$GITHUB_STEP_SUMMARY"

      # og-bam's fetch smoke (docs/rust.md): fetch.pysam.tsv, the reads
      # pysam's fetch returned on each region of regions.tsv, must be what
      # samtools in SAMTOOLS_IMAGE returns there (reference_end and the
      # aligned blocks worked out from each CIGAR), and both static binaries,
      # each on its own arch, must write it byte for byte.
      - name: og-bam fetch equals samtools and pysam, amd64 and arm64, and the binary sizes
        shell: bash
        run: |
          . versions.env
          d=rust/crates/og-bam/tests/data
          out="${RUNNER_TEMP}/fetch.tsv"
          rust/crates/og-bam/tests/samtools_fetch.sh "$SAMTOOLS_IMAGE" > "$out"
          diff "$out" "${d}/fetch.pysam.tsv" || { echo "ERROR: samtools does not return the reads of fetch.pysam.tsv"; exit 1; }
          echo "samtools: $(wc -l < "$out") reads, the same as fetch.pysam.tsv"
          # Control: a CIGAR deletion that does not move the reference must differ.
          # The helper must still finish: a failed run is not a caught mistake.
          planted="${RUNNER_TEMP}/fetch-planted.tsv"
          OG_FETCH_PLANT=deletion rust/crates/og-bam/tests/samtools_fetch.sh "$SAMTOOLS_IMAGE" > "$planted"
          # cmp: 1 is a difference, 0 a passed mistake, 2 a comparison error.
          rc=0; cmp -s "$planted" "${d}/fetch.pysam.tsv" || rc=$?
          [ "$rc" -eq 1 ] || { echo "ERROR: the samtools check did not catch a planted CIGAR mistake (cmp exit $rc)"; exit 1; }
          echo "Control: a planted CIGAR mistake differs from fetch.pysam.tsv."
          for p in amd64:x86_64 arm64:aarch64; do
            docker run --rm --platform "linux/${p%:*}" -v "${PWD}:/w:ro" -w /w "$PYTHON_IMAGE" \
              "bin/.og/og-linux-${p#*:}" bam-fetch-probe "${d}/cyp2d6.bam" "${d}/regions.tsv" > "$out"
            diff "$out" "${d}/fetch.pysam.tsv" || { echo "ERROR: og-linux-${p#*:} fetches what pysam does not"; exit 1; }
            echo "og-linux-${p#*:} on ${p%:*}: $(wc -l < "$out") reads, the same as pysam"
          done
          {
            echo "| binary | bytes |"
            echo "|---|---|"
            for f in bin/.og/og-linux-*; do echo "| ${f##*/} | $(stat -c %s "$f") |"; done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Control: the same check must fail when an image runs the wrong build.
      # The amd64 binary planted as og-linux-aarch64 reports x86_64 on arm64.
      - name: Control (a planted wrong-arch binary must fail the image check)
        run: |
          cp bin/.og/og-linux-aarch64 "${RUNNER_TEMP}/og-linux-aarch64"
          cp bin/.og/og-linux-x86_64 bin/.og/og-linux-aarch64
          rc=0
          tests/rust/og-in-images.sh PYTHON_IMAGE || rc=$?
          cp "${RUNNER_TEMP}/og-linux-aarch64" bin/.og/og-linux-aarch64
          [ "$rc" -ne 0 ] || { echo "ERROR: the image check passed a wrong-arch binary"; exit 1; }
          echo "Control: the image check failed on the planted binary, as it must."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: og-binaries
          path: bin/.og/og-linux-*
          retention-days: 7
