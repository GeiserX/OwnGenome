name: Public evidence

# Runs opt-in steps on public data only (GIAB's HG002 and the public archaic
# and ancient panels, 1000 Genomes men with published Y haplogroups, genomes
# with public assemblies and 30x reads), and writes what they measured to the
# job summary. No pull request runs it, so none of its jobs gates a merge.
#
#   archaic-sites      the 1000 Genomes sites file setup.sh --archaic reads,
#                      downloaded once (its md5 checked) and indexed, for
#                      every chromosome job.
#   archaic-hg002      setup.sh --archaic and step 43 on HG002's GIAB v4.2.1
#                      genotypes (with a gVCF of one reference block per
#                      GIAB benchmark interval, since step 43 reads a site
#                      with no record as the reference only inside one),
#                      one job per autosome of the chromosomes
#                      input (all 22 by default: about 150 GB of archaic
#                      downloads in all; each job fetches its three files
#                      side by side first, and setup.sh resumes them and
#                      checks their md5), then archaic-share joins them into
#                      one report per population and prints HG002's
#                      Neanderthal and Denisovan shares, the Neanderthal
#                      total against the published range when all 22 ran,
#                      and how many of HG002's positions carry two records,
#                      one an SNV.
#                      The job "empty" is the red control: an empty region
#                      list must make it fail.
#   archaic-same-person  the method check: one 1000 Genomes person with
#                      Chen et al.'s released calls, step 43 on her high- and
#                      low-coverage genotypes (each with a gVCF of one
#                      reference block per chromosome), beside the released
#                      figure.
#   ancient-footprint  setup.sh --ancient-panel on the full AADR 1240K files,
#                      then step 44 on HG002, each with the peak memory of
#                      its containers (the cgroup's memory.peak), the peak
#                      disk use and the time. The ancient input off skips it.
#   y-benchmark        step 37 on the chrY of 1000 Genomes men (NYGC 30x
#                      CRAMs) with published Y haplogroups (Poznik et al.
#                      2016), and og dev evidence y-bench: each tool's
#                      call (Yleaf, og y tree-place) against the published
#                      one on the current YFull tree. Its gate fails when a
#                      tool puts fewer than Y_MIN of the men on the
#                      published branch or below it; the same calls handed
#                      to other men are the red control and must fail it.
#                      The full 58-man table is in docs/37-y-haplogroup.md.
#   lpa-benchmark      step 46 on the reads over LPA of genomes whose KIV-2
#                      repeats were counted on public assemblies (HG002's Q100
#                      assembly and HPRC release 2; og dev evidence lpa-truth):
#                      HG002 from DeepVariant's 35x BAM, the others from their
#                      NYGC 30x CRAMs, and og dev evidence lpa-bench. Its gate
#                      fails when the interval holds the assembled count in
#                      fewer than LPA_MIN of the genomes; the estimates handed
#                      to other genomes are the red control and must fail it.
#                      A genome whose reads EBI does not serve in 4 tries is
#                      named and left out of the gate; the job fails when
#                      fewer than LPA_READ_MIN of the genomes were read, or
#                      when step 46 fails on reads it got.
#                      The full 96-genome table is in docs/46-lpa.md.
#
# It runs by hand only (workflow_dispatch). Public repo: the GitHub-hosted
# runner is free here.
on:
  workflow_dispatch:
    inputs:
      chromosomes:
        description: "Autosomes for the archaic jobs, separated by spaces or commas (for example 22), or all"
        type: string
        default: all
      ancient:
        description: "Run the ancient-footprint job too"
        type: boolean
        default: true
      hg002:
        description: "Run the archaic-hg002 and archaic-share jobs (the whole-genome HG002 run)"
        type: boolean
        default: true
      same_person:
        description: "1000 Genomes person for the archaic-same-person job (Chen et al. released calls exist for them)"
        type: string
        default: NA12878
      same_person_chromosomes:
        description: "Autosomes for the archaic-same-person job, separated by spaces or commas, or none"
        type: string
        default: none
      y_benchmark:
        description: "Run the y-benchmark job"
        type: boolean
        default: true
      y_samples:
        description: "1000 Genomes men for the y-benchmark job, separated by spaces or commas (3 or more, from different haplogroups: the red control hands each man's calls to another; the docs table has 58)"
        type: string
        default: HG01890 HG02588 NA18952 HG01583 HG00530 HG00107
      lpa_benchmark:
        description: "Run the lpa-benchmark job"
        type: boolean
        default: true
      lpa_samples:
        description: "Genomes for the lpa-benchmark job, separated by spaces or commas (3 or more, from og dev evidence lpa-truth), or all (96)"
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NCBI_REF: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/001/405/GCA_000001405.15_GRCh38/seqs_for_alignment_pipelines.ucsc_ids
  GIAB_HG002: https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/release/AshkenazimTrio/HG002_NA24385_son/NISTv4.2.1/GRCh38/HG002_GRCh38_1_22_v4.2.1_benchmark
  # y-benchmark: Poznik et al. 2016's calls (column 3, the most derived
  # SNP seen), the index of the NYGC 30x CRAMs, and chrY of the reference
  # those CRAMs were aligned to (its M5 is the CRAM header's).
  Y_CALLS: https://ftp.1000genomes.ebi.ac.uk/vol1/ftp/release/20130502/supporting/chrY/1000Y.sample_level_haplogroup_calls.ver5.txt
  Y_CALLS_SHA256: a7975573a1aa2d708ee09d1a11aa3d6feb4efe6ac3db3db5bdba5069d512df42
  Y_HC_INDEX: https://ftp.1000genomes.ebi.ac.uk/vol1/ftp/data_collections/1000G_2504_high_coverage/1000G_2504_high_coverage.sequence.index
  Y_HC_INDEX_SHA256: 0ac5fdda0b60b6575b1867827f53e39d723f915b325b10bf023b2dc3d71c08f2
  Y_REF: https://ftp.1000genomes.ebi.ac.uk/vol1/ftp/technical/reference/GRCh38_reference_genome/GRCh38_full_analysis_set_plus_decoy_hla.fa
  Y_REF_CHRY_MD5: ce3e31103314a704255f3cd90369ecce
  Y_MIN: "0.95"
  # lpa-benchmark: chr6 of the same reference (the CRAM header's M5), HG002's
  # reads (the BAM e2e case lpa-1 reads), the share of genomes whose
  # interval must hold the assembled count, and the share that must be read
  # (0.93: 90 of 96; from the runner EBI failed to serve 1 or 2 of the 96 in
  # 4 tries on each of two runs).
  LPA_REF_CHR6_MD5: 5691468a67c7e7a7b5f2a3a683792c29
  LPA_HG002_BAM: https://storage.googleapis.com/deepvariant/case-study-testdata/HG002.novaseq.pcr-free.35x.dedup.grch38_no_alt.bam
  LPA_MIN: "0.95"
  LPA_READ_MIN: "0.93"

jobs:
  archaic-sites:
    # Only the archaic jobs read the sites file.
    if: inputs.hg002 || inputs.same_person_chromosomes != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The chromosomes to run
        id: plan
        env:
          CHROMOSOMES: ${{ inputs.chromosomes }}
        run: |
          set -euo pipefail
          read -ra want <<< "$(printf '%s' "$CHROMOSOMES" | tr ',\r\n' '   ')"
          [ "${want[*]:-all}" != all ] || mapfile -t want < <(seq 1 22)
          for c in "${want[@]}"; do
            [[ "$c" =~ ^([1-9]|1[0-9]|2[0-2])$ ]] || { echo "chromosomes: '${c}' is not an autosome 1 to 22"; exit 1; }
          done
          list=$(printf '%s\n' "${want[@]}" | sort -nu)
          # The empty part is the red control and always runs.
          parts=$(printf '%s\n' empty "$list" | jq -Rnc '[inputs]')
          echo "parts=${parts}" >> "$GITHUB_OUTPUT"
          echo "count=$(grep -c . <<< "$list")" >> "$GITHUB_OUTPUT"
          echo "archaic parts: ${parts}"
      - name: The 1000 Genomes phase 3 sites file and its index
        run: |
          set -euo pipefail
          . ./versions.env
          url=$(sed -n 's/^ARCHAIC_1KG_SITES_URL=//p' scripts/setup.sh)
          mkdir -p sites
          curl -fsSL --retry 5 -o sites/1kg_sites.vcf.gz "$url"
          [ "$(md5sum sites/1kg_sites.vcf.gz | cut -d' ' -f1)" = "$ARCHAIC_1KG_SITES_MD5" ] || { echo "md5 of ${url} is not ARCHAIC_1KG_SITES_MD5"; exit 1; }
          docker run --rm -u "$(id -u):$(id -g)" -v "${PWD}/sites:/s" "$BCFTOOLS_IMAGE" bcftools index -t /s/1kg_sites.vcf.gz
          ls -l sites
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archaic-1kg-sites
          path: sites
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  archaic-hg002:
    if: inputs.hg002
    name: archaic-hg002 (${{ matrix.part }})
    needs: archaic-sites
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # Eight at a time, so the other pull requests keep runners.
      max-parallel: 8
      matrix:
        # empty, then the autosomes of the chromosomes input (archaic-sites' plan step).
        part: ${{ fromJSON(needs.archaic-sites.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space and pick the work area
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / /mnt
          work="${RUNNER_TEMP}/ev"
          if [ "$(df --output=avail -k /mnt | tail -1)" -gt "$(df --output=avail -k / | tail -1)" ]; then
            work=/mnt/ev
            sudo mkdir -p "$work" && sudo chown "$(id -u):$(id -g)" "$work"
          fi
          echo "EV=${work}" >> "$GITHUB_ENV"

      - name: The GRCh38 reference, its index and dictionary
        run: |
          set -euo pipefail
          . ./versions.env
          R="${EV}/genome/reference"
          mkdir -p "$R"
          f=GCA_000001405.15_GRCh38_no_alt_analysis_set.fna
          curl -fsSL --retry 5 -o "${R}/md5.txt" "${NCBI_REF}/md5checksums.txt"
          curl -fsSL --retry 5 -o "${R}/${f}.gz" "${NCBI_REF}/${f}.gz"
          curl -fsSL --retry 5 -o "${R}/GRCh38_no_alt_analysis_set.fasta.fai" "${NCBI_REF}/${f}.fai"
          want=$(awk -v n="./${f}.gz" '$2 == n {print $1}' "${R}/md5.txt")
          [ -n "$want" ] && [ "$(md5sum "${R}/${f}.gz" | cut -d' ' -f1)" = "$want" ] || { echo "md5 of ${f}.gz is not NCBI's"; exit 1; }
          want=$(awk -v n="./${f}.fai" '$2 == n {print $1}' "${R}/md5.txt")
          [ -n "$want" ] && [ "$(md5sum "${R}/GRCh38_no_alt_analysis_set.fasta.fai" | cut -d' ' -f1)" = "$want" ] || { echo "md5 of ${f}.fai is not NCBI's"; exit 1; }
          gzip -dc "${R}/${f}.gz" > "${R}/GRCh38_no_alt_analysis_set.fasta"
          rm -f "${R}/${f}.gz"
          docker run --rm -u "$(id -u):$(id -g)" -v "${R}:/r" "$SAMTOOLS_IMAGE" \
            samtools dict -o /r/GRCh38_no_alt_analysis_set.dict /r/GRCh38_no_alt_analysis_set.fasta
          ls -l "$R"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archaic-1kg-sites
          path: sites

      - name: Build og as scripts/setup.sh --og does (og dev evidence)
        run: |
          scripts/setup.sh --og
          rust/og.sh check --required

      - name: setup.sh --archaic and step 43 on HG002 (chromosome ${{ matrix.part }})
        id: run
        continue-on-error: ${{ matrix.part == 'empty' }}
        env:
          PART: ${{ matrix.part }}
          THREADS: '4'
        run: |
          set -euo pipefail
          . ./versions.env
          G="${EV}/genome" OUT="${EV}/out/${PART}"
          CHROMS=$PART
          [ "$PART" != empty ] || CHROMS=""
          DATA="${G}/reference/archaic/${ARCHAIC_DATA_VERSION}"
          mkdir -p "$OUT" "${DATA}/download"
          mv sites/1kg_sites.vcf.gz sites/1kg_sites.vcf.gz.tbi "${DATA}/download/"
          # The whole GRCh37 chromosome; the empty job writes an empty list.
          : > "${EV}/regions37.bed"
          for c in $CHROMS; do printf '%s\t0\t300000000\n' "$c" >> "${EV}/regions37.bed"; done
          # The three archaic files side by side, under the names setup.sh's
          # fetch resumes (it checks each against the pinned md5 list).
          DL0=$(date +%s)
          for c in $CHROMS; do
            T0=$(date +%s)
            for g in Altai Vindija33.19 Denisova; do
              curl -fsSL --retry 5 -C - -o "${DATA}/download/${g}.chr${c}.vcf.gz.part" \
                "https://cdna.eva.mpg.de/neandertal/Vindija/VCF/${g}/chr${c}_mq25_mapab100.vcf.gz" &
            done
            wait
            du -cb "${DATA}"/download/*.chr"${c}".vcf.gz.part | tail -1 | cut -f1 > "${EV}/dl_bytes"
            echo "chr${c}: $(cat "${EV}/dl_bytes") bytes in $(( $(date +%s) - T0 )) s"
          done
          T0=$(date +%s)
          if ! ARCHAIC_REGIONS="${EV}/regions37.bed" scripts/setup.sh --archaic "$G" 2>&1 | tee "${OUT}/setup.log"; then
            echo "setup.sh --archaic failed"; exit 1
          fi
          printf 'download_seconds\t%s\ndownload_bytes\t%s\n' "$(( T0 - DL0 ))" \
            "$(cat "${EV}/dl_bytes" 2>/dev/null || echo 0)" > "${OUT}/setup.tsv"
          printf 'setup_seconds\t%s\ntable_bytes\t%s\ntable_rows\t%s\n' "$(( $(date +%s) - T0 ))" \
            "$(du -sb "$DATA" | cut -f1)" "$(for t in "${DATA}"/chr*.tsv.gz; do gzip -dc "$t" | tail -n +2; done | wc -l)" \
            >> "${OUT}/setup.tsv"
          cat "${OUT}/setup.tsv"

          mkdir -p "${G}/HG002/vcf"
          curl -fsSL --retry 5 -o "${G}/HG002/vcf/HG002.vcf.gz" "${GIAB_HG002}.vcf.gz"
          curl -fsSL --retry 5 -o "${G}/HG002/vcf/HG002.vcf.gz.tbi" "${GIAB_HG002}.vcf.gz.tbi"
          # Step 43 reads a site with no record as the reference only inside a
          # reference block of the gVCF beside the VCF. GIAB states HG002
          # matches the reference inside its benchmark regions and makes no
          # claim outside them, so the gVCF is one block per benchmark
          # interval of the part's chromosomes (the VCF gives the variants).
          curl -fsSL --retry 5 -o "${EV}/truth.bed" "${GIAB_HG002}_noinconsistent.bed"
          FAI="${G}/reference/GRCh38_no_alt_analysis_set.fasta.fai"
          {
            printf '##fileformat=VCFv4.2\n'
            for c in $CHROMS; do awk -F'\t' -v c="chr${c}" '$1 == c {printf "##contig=<ID=%s,length=%s>\n", $1, $2}' "$FAI"; done
            printf '##ALT=<ID=*,Description="Any other allele">\n'
            printf '##INFO=<ID=END,Number=1,Type=Integer,Description="End of the block">\n'
            printf '##FORMAT=<ID=GT,Number=1,Type=String,Description="Genotype">\n'
            printf '#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\tFORMAT\tHG002\n'
            for c in $CHROMS; do
              awk -F'\t' -v c="chr${c}" 'BEGIN {OFS = "\t"} $1 == c {print c, $2 + 1, ".", "N", "<*>", ".", ".", "END=" $3, "GT", "0/0"}' \
                "${EV}/truth.bed" | sort -k2,2n
            done
          } > "${EV}/HG002.g.vcf"
          docker run --rm -u "$(id -u):$(id -g)" -v "${EV}:/e" -v "${G}:/g" "$BCFTOOLS_IMAGE" \
            bcftools view -Oz -o /g/HG002/vcf/HG002.g.vcf.gz /e/HG002.g.vcf
          echo "gVCF: $(grep -vc '^#' "${EV}/HG002.g.vcf") reference blocks"
          for pop in ALL EUR; do
            if ! ARCHAIC_POP=$pop GENOME_DIR="$G" scripts/43-archaic.sh HG002 2>&1 | tee "${OUT}/step43-${pop}.log"; then
              echo "step 43 (${pop}) failed"; exit 1
            fi
            mkdir -p "${OUT}/${pop}"
            cp "${G}/HG002/archaic/work/ibdmix/"chr*.txt "${G}/HG002/archaic/work/ibdmix/spans.tsv" "${OUT}/${pop}/"
            sites=$(awk -F'\t' 'NR > 1 {n += $4} END {print n + 0}' "${OUT}/${pop}/spans.tsv")
            chroms=$(awk 'NR > 1' "${OUT}/${pop}/spans.tsv" | wc -l)
            echo "step 43 (${pop}): ${chroms} chromosomes, ${sites} sites"
            [ "$sites" -gt 0 ] || { echo "step 43 (${pop}) analysed no site"; exit 1; }
            [ "$chroms" -eq "$(echo "$CHROMS" | wc -w)" ] || { echo "step 43 (${pop}) analysed ${chroms} of the part's chromosomes"; exit 1; }
          done

          # The positions of this part where HG002 has two records or more, one
          # of them an SNV, as GIAB writes the VCF and split with bcftools
          # norm -m-, and how many of them are rows of the table (the rows the
          # same-position rule of og archaic genotypes decides).
          docker run --rm -u "$(id -u):$(id -g)" -v "${G}:/g" "$BCFTOOLS_IMAGE" \
            bcftools norm -m- -Oz -o /g/HG002/split.vcf.gz /g/HG002/vcf/HG002.vcf.gz
          bin/og dev evidence clashes "${G}/HG002/vcf/HG002.vcf.gz" "${G}/HG002/split.vcf.gz" "$DATA" "$OUT/affected.tsv"
          cat "$OUT/affected.tsv"

      - name: The red control failed, as it must
        if: matrix.part == 'empty'
        env:
          OUTCOME: ${{ steps.run.outcome }}
          PART: ${{ matrix.part }}
        run: |
          echo "outcome of the run on an empty region list: ${OUTCOME}"
          [ "$OUTCOME" = failure ]
          # and for that reason, not an earlier download or install failure
          grep -F 'regions37.bed is not a file' "${EV}/out/${PART}/setup.log"

      - name: Upload the part
        if: matrix.part != 'empty'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archaic-part-${{ matrix.part }}
          path: ${{ env.EV }}/out/${{ matrix.part }}
          if-no-files-found: error

  archaic-same-person:
    # The method check behind the whole-genome gate: one 1000 Genomes person
    # whose IBDmix calls Chen et al. 2020 released, run through step 43 on two
    # inputs for the same person (the NYGC 30x high-coverage genotypes, and the
    # original low-coverage phase 3 data called again on GRCh38), beside the
    # released figure for that person and for the 1000 Genomes group.
    needs: archaic-sites
    if: inputs.same_person_chromosomes != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SAMPLE: ${{ inputs.same_person }}
      CHROMS: ${{ inputs.same_person_chromosomes }}
      CHEN_ID: 125XCvTpQbK6TPX84y4442ZaDLDbxWMCf
      CHEN_SHA256: 454bfa32f6b3cf4b48f0466b601054f5ed141fe61fea3aff4d3284a7a1f4dc5b
      HC_URL: https://ftp.1000genomes.ebi.ac.uk/vol1/ftp/data_collections/1000G_2504_high_coverage/working/20220422_3202_phased_SNV_INDEL_SV
      LC_URL: https://ftp.1000genomes.ebi.ac.uk/vol1/ftp/data_collections/1000_genomes_project/release/20190312_biallelic_SNV_and_INDEL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space and pick the work area
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / /mnt
          work="${RUNNER_TEMP}/ev"
          if [ "$(df --output=avail -k /mnt | tail -1)" -gt "$(df --output=avail -k / | tail -1)" ]; then
            work=/mnt/ev
            sudo mkdir -p "$work" && sudo chown "$(id -u):$(id -g)" "$work"
          fi
          echo "EV=${work}" >> "$GITHUB_ENV"
          read -ra want <<< "$(printf '%s' "$CHROMS" | tr ',\r\n' '   ')"
          for c in "${want[@]}"; do
            [[ "$c" =~ ^([1-9]|1[0-9]|2[0-2])$ ]] || { echo "same_person_chromosomes: '${c}' is not an autosome 1 to 22"; exit 1; }
          done
          [[ "$SAMPLE" =~ ^(HG|NA)[0-9]+$ ]] || { echo "same_person: '${SAMPLE}' is not a 1000 Genomes sample"; exit 1; }
          (( ${#want[@]} > 0 )) || { echo "same_person_chromosomes: select at least one autosome"; exit 1; }
          # each chromosome once, in order
          echo "LIST=$(printf '%s\n' "${want[@]}" | sort -nu | tr '\n' ' ' | sed 's/ $//')" >> "$GITHUB_ENV"

      - name: The GRCh38 reference, its index and dictionary
        run: |
          set -euo pipefail
          . ./versions.env
          R="${EV}/genome/reference"
          mkdir -p "$R"
          f=GCA_000001405.15_GRCh38_no_alt_analysis_set.fna
          curl -fsSL --retry 5 -o "${R}/md5.txt" "${NCBI_REF}/md5checksums.txt"
          curl -fsSL --retry 5 -o "${R}/${f}.gz" "${NCBI_REF}/${f}.gz"
          curl -fsSL --retry 5 -o "${R}/GRCh38_no_alt_analysis_set.fasta.fai" "${NCBI_REF}/${f}.fai"
          want=$(awk -v n="./${f}.gz" '$2 == n {print $1}' "${R}/md5.txt")
          [ -n "$want" ] && [ "$(md5sum "${R}/${f}.gz" | cut -d' ' -f1)" = "$want" ] || { echo "md5 of ${f}.gz is not NCBI's"; exit 1; }
          gzip -dc "${R}/${f}.gz" > "${R}/GRCh38_no_alt_analysis_set.fasta"
          rm -f "${R}/${f}.gz"
          docker run --rm -u "$(id -u):$(id -g)" -v "${R}:/r" "$SAMTOOLS_IMAGE" \
            samtools dict -o /r/GRCh38_no_alt_analysis_set.dict /r/GRCh38_no_alt_analysis_set.fasta

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archaic-1kg-sites
          path: sites

      - name: Chen et al.'s released calls (sha256 pinned)
        run: |
          set -euo pipefail
          mkdir -p "${EV}/chen"
          curl -fsSL --retry 5 -o "${EV}/chen/chen.txt" "https://drive.usercontent.google.com/download?id=${CHEN_ID}&export=download&confirm=t"
          [ "$(sha256sum "${EV}/chen/chen.txt" | cut -d' ' -f1)" = "$CHEN_SHA256" ] || { echo "sha256 of Chen's file is not the pinned one"; head -c 300 "${EV}/chen/chen.txt"; exit 1; }
          awk -v s="$SAMPLE" '$9 == s {n++} END {print s, n+0, "released segments"; exit n == 0}' "${EV}/chen/chen.txt"

      - name: setup.sh --archaic for the chromosomes
        env:
          THREADS: '4'
        run: |
          set -euo pipefail
          . ./versions.env
          G="${EV}/genome"
          DATA="${G}/reference/archaic/${ARCHAIC_DATA_VERSION}"
          mkdir -p "${DATA}/download"
          mv sites/1kg_sites.vcf.gz sites/1kg_sites.vcf.gz.tbi "${DATA}/download/"
          : > "${EV}/regions37.bed"
          for c in $LIST; do printf '%s\t0\t300000000\n' "$c" >> "${EV}/regions37.bed"; done
          for c in $LIST; do
            for g in Altai Vindija33.19 Denisova; do
              curl -fsSL --retry 5 -C - -o "${DATA}/download/${g}.chr${c}.vcf.gz.part" \
                "https://cdna.eva.mpg.de/neandertal/Vindija/VCF/${g}/chr${c}_mq25_mapab100.vcf.gz" &
            done
            wait
          done
          ARCHAIC_REGIONS="${EV}/regions37.bed" scripts/setup.sh --archaic "$G" 2>&1 | tee "${EV}/setup.log"
          [ "${PIPESTATUS[0]}" -eq 0 ]
          test -s "${DATA}/DONE"

      - name: The person on both inputs, step 43 on each, and the comparison
        env:
          THREADS: '4'
        run: |
          set -euo pipefail
          . ./versions.env
          G="${EV}/genome" OUT="${EV}/out"
          DATA="${G}/reference/archaic/${ARCHAIC_DATA_VERSION}"
          mkdir -p "$OUT"
          # pull LABEL URL-PREFIX NAME-OF-FILE-PATTERN: the person's SNV records
          # on the chromosomes that are not homozygous reference, one VCF: the
          # ALT calls, and the sites with no call, which step 43 reads as
          # unknown (a VCF record wins over the gVCF's reference block).
          pull() {
            local label=$1 url=$2 pat=$3 c parts=""
            mkdir -p "${G}/${SAMPLE}${label}/vcf"
            for c in $LIST; do
              f="${pat//@/${c}}"
              # The container has no CA bundle, so curl fetches the file here.
              curl -fsSL --retry 5 -o "${EV}/in.vcf.gz" "${url}/${f}"
              curl -fsSL --retry 5 -o "${EV}/in.vcf.gz.tbi" "${url}/${f}.tbi"
              docker run --rm -u "$(id -u):$(id -g)" -v "${EV}:/e" "$BCFTOOLS_IMAGE" bash -euo pipefail -c '
                bcftools view -s "$1" -v snps -Ou /e/in.vcf.gz | bcftools view -e "GT=\"ref\"" -Oz -o "/e/$2.raw.vcf.gz"' _ "$SAMPLE" "$label"
              # The 2019 recall names the contigs 22, not chr22: rename them
              # (a name already chrN stays as it is).
              printf '%s\tchr%s\n' "$c" "$c" > "${EV}/rename.txt"
              docker run --rm -u "$(id -u):$(id -g)" -v "${EV}:/e" "$BCFTOOLS_IMAGE" \
                bcftools annotate --rename-chrs /e/rename.txt -Oz -o "/e/${label}.chr${c}.vcf.gz" "/e/${label}.raw.vcf.gz"
              rm -f "${EV}/${label}.raw.vcf.gz"
              rm -f "${EV}/in.vcf.gz" "${EV}/in.vcf.gz.tbi"
              parts="${parts} /e/${label}.chr${c}.vcf.gz"
            done
            # shellcheck disable=SC2086
            docker run --rm -u "$(id -u):$(id -g)" -v "${EV}:/e" -v "${G}:/g" "$BCFTOOLS_IMAGE" \
              bcftools concat -Oz -o "/g/${SAMPLE}${label}/vcf/${SAMPLE}${label}.vcf.gz" $parts
            docker run --rm -u "$(id -u):$(id -g)" -v "${G}:/g" "$BCFTOOLS_IMAGE" \
              bcftools index -t -f "/g/${SAMPLE}${label}/vcf/${SAMPLE}${label}.vcf.gz"
            rm -f "${EV}/${label}".chr*.vcf.gz
            # How many records, how many of them with no call, and how many of
            # those at a table site (the sites step 43 reads as unknown).
            docker run --rm -v "${G}:/g" "$BCFTOOLS_IMAGE" bcftools query -i 'GT="mis"' -f '%CHROM\t%POS\n' \
              "/g/${SAMPLE}${label}/vcf/${SAMPLE}${label}.vcf.gz" > "${EV}/${label}.nocall.tsv"
            echo "${label}: $(docker run --rm -v "${G}:/g" "$BCFTOOLS_IMAGE" bcftools view -H "/g/${SAMPLE}${label}/vcf/${SAMPLE}${label}.vcf.gz" | wc -l) SNV records," \
              "$(wc -l < "${EV}/${label}.nocall.tsv") of them with no call," \
              "$(for t in "${DATA}"/chr*.tsv.gz; do gzip -dc "$t"; done \
                | awk -F'\t' 'FILENAME == ARGV[1] {m[$1 FS $2] = 1; next} ($1 FS $2) in m {n++} END {print n + 0}' "${EV}/${label}.nocall.tsv" -) of those at a table site"
            # Step 43 reads a site with no record as the reference only inside
            # a reference block of the gVCF. A panel VCF holds no callable mask,
            # so the gVCF is one block over each whole chromosome: a site with
            # no record (the person is 0/0 there, or the panel has no variant
            # there) reads as the reference, as this check measured before step
            # 43 needed a gVCF, and a site with no call stays unknown.
            {
              printf '##fileformat=VCFv4.2\n'
              for c in $LIST; do awk -F'\t' -v c="chr${c}" '$1 == c {printf "##contig=<ID=%s,length=%s>\n", $1, $2}' "$FAI"; done
              printf '##ALT=<ID=*,Description="Any other allele">\n'
              printf '##INFO=<ID=END,Number=1,Type=Integer,Description="End of the block">\n'
              printf '##FORMAT=<ID=GT,Number=1,Type=String,Description="Genotype">\n'
              printf '#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\tFORMAT\t%s\n' "${SAMPLE}${label}"
              for c in $LIST; do
                awk -F'\t' -v c="chr${c}" 'BEGIN {OFS = "\t"} $1 == c {print c, 1, ".", "N", "<*>", ".", ".", "END=" $2, "GT", "0/0"}' "$FAI"
              done
            } > "${EV}/${label}.g.vcf"
            docker run --rm -u "$(id -u):$(id -g)" -v "${EV}:/e" -v "${G}:/g" "$BCFTOOLS_IMAGE" \
              bcftools view -Oz -o "/g/${SAMPLE}${label}/vcf/${SAMPLE}${label}.g.vcf.gz" "/e/${label}.g.vcf"
          }
          FAI="${G}/reference/GRCh38_no_alt_analysis_set.fasta.fai"
          pull hc "$HC_URL" '1kGP_high_coverage_Illumina.chr@.filtered.SNV_INDEL_SV_phased_panel.vcf.gz'
          pull lc "$LC_URL" 'ALL.chr@.shapeit2_integrated_snvindels_v2a_27022019.GRCh38.phased.vcf.gz'
          args=()
          for label in hc lc; do
            for pop in ALL EUR; do
              ARCHAIC_POP=$pop GENOME_DIR="$G" scripts/43-archaic.sh "${SAMPLE}${label}" 2>&1 | tee "${OUT}/step43-${label}-${pop}.log"
              cp "${G}/${SAMPLE}${label}/archaic/${SAMPLE}${label}_archaic_segments.tsv" "${OUT}/${label}-${pop}.segments.tsv"
              cp "${G}/${SAMPLE}${label}/archaic/${SAMPLE}${label}_archaic.tsv" "${OUT}/${label}-${pop}.summary.tsv"
              mkdir -p "${OUT}/ibdmix-${label}-${pop}"
              cp "${G}/${SAMPLE}${label}/archaic/work/ibdmix/"chr*.txt "${G}/${SAMPLE}${label}/archaic/work/ibdmix/spans.tsv" "${OUT}/ibdmix-${label}-${pop}/"
              args+=(--mine "${label}-${pop}=${OUT}/${label}-${pop}.segments.tsv")
            done
          done
          grp=$(awk -v s="$SAMPLE" '$9 == s {print $8; exit}' "${EV}/chen/chen.txt")
          bin/og archaic compare --chen-file "${EV}/chen/chen.txt" --sample "$SAMPLE" --group "$grp" \
            --chroms "$LIST" "${args[@]}" | tee "${OUT}/comparison.md"
          for label in hc lc; do
            {
              echo "IBDmix output of ${label} (ALL frequencies), per archaic genome:"
              echo ""
              bin/og archaic genomes --chen-file "${EV}/chen/chen.txt" --sample "$SAMPLE" \
                --ibdmix-dir "${OUT}/ibdmix-${label}-ALL" --spans "${OUT}/ibdmix-${label}-ALL/spans.tsv"
              echo ""
            } | tee -a "${OUT}/genomes.md"
          done
          {
            echo "### Same person: ${SAMPLE} (${grp}), chromosomes ${LIST}"
            echo ""
            echo "hc = NYGC 30x high-coverage genotypes (GRCh38); lc = the original low-coverage phase 3 data called again on GRCh38. ALL and EUR are the 1000 Genomes frequencies step 43 used."
            echo ""
            cat "${OUT}/comparison.md"
            echo ""
            cat "${OUT}/genomes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the segments and the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archaic-same-person
          path: ${{ env.EV }}/out
          if-no-files-found: error

  archaic-share:
    needs: [archaic-sites, archaic-hg002]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archaic-part-*
          path: parts
      - name: Give a lone part its own folder
        env:
          PARTS: ${{ needs.archaic-sites.outputs.parts }}
        run: |
          set -euo pipefail
          # download-artifact puts a single matching artifact straight into
          # parts/, without the archaic-part-<chromosome> folder the steps
          # below read.
          if ! compgen -G 'parts/archaic-part-*' > /dev/null; then
            c=$(jq -r '.[1]' <<< "$PARTS")
            mv parts "lone-${c}" && mkdir parts && mv "lone-${c}" "parts/archaic-part-${c}"
          fi
          ls parts
      - name: Build og (og archaic report)
        working-directory: rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          OG_TREE_HASH=$(./og.sh tree-hash) cargo build --release --locked -p og
      - name: One report per population, over the autosomes that ran
        env:
          WANT: ${{ needs.archaic-sites.outputs.count }}
        run: |
          set -euo pipefail
          if [ "$WANT" -eq 22 ]; then what="whole genome"; else what="${WANT} of the 22 autosomes"; fi
          {
            echo "### Step 43 on HG002, ${what} (GIAB v4.2.1 genotypes)"
            echo ""
            echo "| chromosome | archaic download GB | download seconds | setup seconds | table GB | table rows |"
            echo "|---|---|---|---|---|---|"
            for p in parts/archaic-part-*; do
              kv() { awk -F'\t' -v k="$1" '$1 == k {print $2}' "${p}/setup.tsv"; }
              echo "| ${p##*-} | $(awk -v b="$(kv download_bytes)" 'BEGIN {printf "%.2f", b / 1e9}') | $(kv download_seconds) | $(kv setup_seconds) | $(awk -v b="$(kv table_bytes)" 'BEGIN {printf "%.2f", b / 1e9}') | $(kv table_rows) |"
            done
            cat parts/archaic-part-*/setup.tsv | awk -F'\t' '{t[$1] += $2}
              END {printf "| all | %.2f | %d | %d | %.2f | %d |\n", t["download_bytes"] / 1e9, t["download_seconds"],
                   t["setup_seconds"], t["table_bytes"] / 1e9, t["table_rows"]}'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for pop in ALL EUR; do
            d="joined/${pop}"
            mkdir -p "${d}/ibdmix"
            cp parts/archaic-part-*/"${pop}"/chr*.txt "${d}/ibdmix/"
            { printf 'chrom\tfirst\tlast\tsites\n'; for s in parts/archaic-part-*/"${pop}"/spans.tsv; do tail -n +2 "$s" | cut -f1-4; done; } > "${d}/spans.tsv"
            rust/target/release/og archaic report --sample HG002 --ibdmix-dir "${d}/ibdmix" --spans "${d}/spans.tsv" \
              --pop "$pop" --out-dir "${d}/out"
            kv() { awk -F'\t' -v k="$1" '$1 == k {print $2}' "${d}/out/HG002_archaic.tsv"; }
            [ "$(kv analysed_chromosomes)" -eq "$WANT" ] || { echo "${pop}: $(kv analysed_chromosomes) chromosomes, want ${WANT}"; exit 1; }
            [ "$(kv analysed_sites)" -gt 0 ] || { echo "${pop}: no site analysed"; exit 1; }
            nea=$(kv neanderthal_percent)
            mb=$(awk -v b="$(kv neanderthal_bp)" 'BEGIN {printf "%.1f", b / 1e6}')
            # Chen et al. 2020 (Cell 180:677), released per-person calls for
            # the 503 Europeans: 42.0 to 62.0 Mb, median 51.6 Mb, made with the
            # Altai genome alone and a refined call set. Step 43 takes the
            # union of Altai and Vindija without the refinements, so its total
            # is larger by design (docs/43-archaic.md, same-person comparison).
            if [ "$WANT" -eq 22 ]; then
              ratio=$(awk -v b="$(kv neanderthal_bp)" 'BEGIN {printf "%.1f", b / 51.6e6}')
              cmp="HG002's ${mb} Mb of Neanderthal sequence is ${ratio} times the median (51.6 Mb) of the per-person totals Chen et al. 2020 released for 503 Europeans (42.0 to 62.0 Mb). Their method uses the Altai genome alone and a refined call set; step 43 takes the union of Altai and Vindija, so it finds more by design (see docs/43-archaic.md)."
            else
              cmp="HG002 has ${mb} Mb of Neanderthal sequence on these ${WANT} autosomes. The per-person totals of Chen et al. 2020 (503 Europeans: 42.0 to 62.0 Mb) are for the 22 autosomes, so they are not compared here."
            fi
            {
              echo "**1000 Genomes ${pop} frequencies:** Neanderthal ${nea}% ($(kv neanderthal_segments) segments, longest $(kv neanderthal_longest_bp) bp), Denisovan $(kv denisovan_percent)% ($(kv denisovan_segments) segments), over $(kv analysed_chromosomes) autosomes, $(kv analysed_bp) bp, $(kv analysed_sites) sites. ${cmp}"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo "HG002 positions with two records or more, one an SNV, and how many are table rows:"
            echo ""
            echo "| VCF | positions | on table rows |"
            echo "|---|---|---|"
            for k in raw split; do
              pos=$(cat parts/archaic-part-*/affected.tsv | awk -F'\t' -v k="${k}_positions" '$1 == k {n += $2} END {print n + 0}')
              tab=$(cat parts/archaic-part-*/affected.tsv | awk -F'\t' -v k="${k}_on_table" '$1 == k {n += $2} END {print n + 0}')
              case "$k" in raw) what="as GIAB writes it" ;; *) what="split with bcftools norm -m-" ;; esac
              echo "| ${what} | ${pos} | ${tab} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  ancient-footprint:
    if: inputs.ancient
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space, add swap and pick the work area
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          # Swap keeps the runner alive if the panel's smartpca passes its RAM;
          # the job then reports the swap it used.
          sudo fallocate -l 8G /mnt/swap-ev && sudo chmod 600 /mnt/swap-ev && sudo mkswap /mnt/swap-ev && sudo swapon /mnt/swap-ev
          df -h / /mnt
          free -m
          nproc
          [ -x /usr/bin/time ] || { sudo apt-get update -q && sudo apt-get install -yq time; }
          work="${RUNNER_TEMP}/ev"
          if [ "$(df --output=avail -k /mnt | tail -1)" -gt "$(df --output=avail -k / | tail -1)" ]; then
            work=/mnt/ev
            sudo mkdir -p "$work" && sudo chown "$(id -u):$(id -g)" "$work"
          fi
          echo "EV=${work}" >> "$GITHUB_ENV"

      - name: The GRCh38 reference and its index
        run: |
          set -euo pipefail
          R="${EV}/genome/reference"
          mkdir -p "$R"
          f=GCA_000001405.15_GRCh38_no_alt_analysis_set.fna
          curl -fsSL --retry 5 -o "${R}/md5.txt" "${NCBI_REF}/md5checksums.txt"
          curl -fsSL --retry 5 -o "${R}/${f}.gz" "${NCBI_REF}/${f}.gz"
          curl -fsSL --retry 5 -o "${R}/GRCh38_no_alt_analysis_set.fasta.fai" "${NCBI_REF}/${f}.fai"
          want=$(awk -v n="./${f}.gz" '$2 == n {print $1}' "${R}/md5.txt")
          [ -n "$want" ] && [ "$(md5sum "${R}/${f}.gz" | cut -d' ' -f1)" = "$want" ] || { echo "md5 of ${f}.gz is not NCBI's"; exit 1; }
          want=$(awk -v n="./${f}.fai" '$2 == n {print $1}' "${R}/md5.txt")
          [ -n "$want" ] && [ "$(md5sum "${R}/GRCh38_no_alt_analysis_set.fasta.fai" | cut -d' ' -f1)" = "$want" ] || { echo "md5 of ${f}.fai is not NCBI's"; exit 1; }
          gzip -dc "${R}/${f}.gz" > "${R}/GRCh38_no_alt_analysis_set.fasta"
          rm -f "${R}/${f}.gz"

      - name: Build og as scripts/setup.sh --og does (og dev evidence)
        run: |
          scripts/setup.sh --og
          rust/og.sh check --required

      - name: setup.sh --ancient-panel and step 44 on HG002, measured
        env:
          THREADS: '4'
        run: |
          set -euo pipefail
          . ./versions.env
          G="${EV}/genome" M="${EV}/measure"
          export GENOME_DIR="$G"
          mkdir -p "$M"
          # measure NAME: every 2 s, into M/NAME.peak until stopped, the peak of
          # any running container's memory.peak (its whole cgroup charge, file
          # cache included, which the kernel drops before it kills a task at
          # the limit), of the anonymous memory in its memory.stat (what the
          # tool itself holds, sampled), of memory.swap.peak, and of the
          # growth of used space on the filesystem that holds G (df: other
          # writers count, a file made and deleted within 2 s does not); and
          # the container's memory.max.
          measure() {
            local out="${M}/$1.peak" mem=0 anon=0 swap=0 disk=0 limit=0 base v id f
            base=$(df --output=used -k "$G" | tail -1)
            while :; do
              for id in $(docker ps -q --no-trunc); do
                for f in "/sys/fs/cgroup/system.slice/docker-${id}.scope" "/sys/fs/cgroup/docker/${id}"; do
                  [ -r "${f}/memory.peak" ] || continue
                  v=$(cat "${f}/memory.peak" 2>/dev/null || echo 0)
                  [ "$v" -le "$mem" ] || { mem=$v; limit=$(cat "${f}/memory.max" 2>/dev/null || echo "$limit"); }
                  v=$(awk '$1 == "anon" {print $2}' "${f}/memory.stat" 2>/dev/null || true); [ "${v:-0}" -le "$anon" ] || anon=$v
                  v=$(cat "${f}/memory.swap.peak" 2>/dev/null || echo 0); [ "$v" -le "$swap" ] || swap=$v
                done
              done
              v=$(( $(df --output=used -k "$G" | tail -1) - base )); [ "$v" -le "$disk" ] || disk=$v
              printf 'mem_bytes\t%s\nanon_bytes\t%s\nswap_bytes\t%s\ndisk_kb\t%s\nlimit\t%s\n' \
                "$mem" "$anon" "$swap" "$disk" "$limit" > "$out"
              sleep 2
            done
          }
          # timed NAME CMD...: CMD under /usr/bin/time -v with the sampler beside it.
          timed() {
            local name=$1 rc pid T0 secs
            shift
            measure "$name" &
            pid=$!
            T0=$(date +%s)
            set +e
            /usr/bin/time -v -o "${M}/${name}.time" "$@" 2>&1 | tee "${M}/${name}.log"
            rc=${PIPESTATUS[0]}
            set -e
            secs=$(( $(date +%s) - T0 ))
            sleep 3
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            printf '%s\t%s\n' seconds "${secs}" >> "${M}/${name}.peak"
            cat "${M}/${name}.peak"
            grep -E 'Maximum resident|Elapsed' "${M}/${name}.time" || true
            [ "$rc" -eq 0 ] || { echo "${name} exited ${rc}"; exit 1; }
            [ "$(awk -F'\t' '$1 == "mem_bytes" {print $2}' "${M}/${name}.peak")" -gt 0 ] \
              || { echo "${name}: the sampler saw no container memory; the measurement is void"; exit 1; }
          }

          timed setup scripts/setup.sh --ancient-panel "$G"
          PANEL="${G}/reference/ancient/aadr_${AADR_VERSION}"
          [ -s "${PANEL}/DONE" ] || { echo "no finished panel at ${PANEL}"; exit 1; }
          {
            printf '%s\t%s\n' panel_bytes "$(du -sb "$PANEL" | cut -f1)"
            printf '%s\t%s\n' panel_sites "$(awk -F'\t' '$1 == "sites_grch38" {print $2}' "${PANEL}/DONE")"
            printf '%s\t%s\n' moderns "$(wc -l < "${PANEL}/moderns.ind")"
            printf '%s\t%s\n' ancients "$(( $(wc -l < "${PANEL}/ancients.tsv") - 1 ))"
          } >> "${M}/setup.peak"

          # HG002 as a gVCF at the panel's sites: GIAB's v4.2.1 genotypes, and
          # a one-base reference block at every other panel site inside GIAB's
          # benchmark regions, where GIAB states HG002 matches the reference.
          mkdir -p "${G}/HG002/vcf"
          curl -fsSL --retry 5 -o "${EV}/truth.vcf.gz" "${GIAB_HG002}.vcf.gz"
          curl -fsSL --retry 5 -o "${EV}/truth.bed" "${GIAB_HG002}_noinconsistent.bed"
          /usr/bin/time -v -o "${M}/gvcf.time" bin/og dev evidence hg002-gvcf "${EV}/truth.vcf.gz" "${EV}/truth.bed" \
            "${G}/reference/GRCh38_no_alt_analysis_set.fasta" "${PANEL}/sites_grch38.tsv" "${EV}/hg002.unsorted.vcf"
          grep -E 'Maximum resident|Elapsed' "${M}/gvcf.time"
          docker run --rm -u "$(id -u):$(id -g)" -v "${EV}:/ev" -v "${G}:/g" "$BCFTOOLS_IMAGE" bash -euo pipefail -c '
            bcftools sort -m 2G -T /ev/sort -Oz -o /g/HG002/vcf/HG002.g.vcf.gz /ev/hg002.unsorted.vcf
            bcftools index -t /g/HG002/vcf/HG002.g.vcf.gz'
          rm -f "${EV}/hg002.unsorted.vcf"

          timed step44 scripts/44-ancient.sh HG002
          INFO="${G}/HG002/ancient/HG002_ancient_info.tsv"
          used=$(awk -F'\t' '$1 == "sites_used" {print $2}' "$INFO")
          printf '%s\t%s\n' sites_used "${used}" >> "${M}/step44.peak"
          [ "${used:-0}" -gt 0 ] || { echo "step 44 used no site"; exit 1; }

          {
            echo "### setup.sh --ancient-panel (AADR ${AADR_VERSION}, full 1240K) and step 44 on HG002"
            echo ""
            echo "Runner: $(nproc) CPUs, $(free -g | awk '/^Mem:/ {print $2}') GB RAM, 8 GB swap added. THREADS=4."
            echo ""
            echo "| run | wall time | peak cgroup memory (cache included) | that container's limit | peak anonymous memory (sampled) | peak swap | peak growth of used disk (df) | RSS of the host script (/usr/bin/time) |"
            echo "|---|---|---|---|---|---|---|---|"
            for n in setup step44; do
              kv() { awk -F'\t' -v k="$1" '$1 == k {v = $2} END {print v}' "${M}/${n}.peak"; }
              rss=$(awk -F': ' '/Maximum resident/ {printf "%.2f GiB", $2 / 1048576}' "${M}/${n}.time")
              gib() { awk -v b="$1" 'BEGIN {if (b ~ /^[0-9]+$/) printf "%.2f GiB", b / 1073741824; else print b}'; }
              echo "| ${n} | $(( $(kv seconds) / 60 )) min | $(gib "$(kv mem_bytes)") | $(gib "$(kv limit)") | $(gib "$(kv anon_bytes)") | $(gib "$(kv swap_bytes)") | $(awk -v k="$(kv disk_kb)" 'BEGIN {printf "%.1f GiB", k / 1048576}') | ${rss} |"
            done
            echo ""
            kv() { awk -F'\t' -v k="$1" '$1 == k {print $2}' "${M}/setup.peak"; }
            echo "Installed panel: $(awk -v b="$(kv panel_bytes)" 'BEGIN {printf "%.2f GiB", b / 1073741824}'), $(kv panel_sites) GRCh38 sites, $(kv moderns) present-day people, $(kv ancients) ancient people. Step 44 used $(awk -F'\t' '$1 == "sites_used" {print $2}' "${M}/step44.peak") sites of HG002."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ancient-footprint
          path: ${{ env.EV }}/measure
          if-no-files-found: ignore

  y-benchmark:
    if: inputs.y_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build og as scripts/setup.sh --og does (og dev evidence)
        run: |
          scripts/setup.sh --og
          rust/og.sh check --required

      - name: Yleaf's data, the current tree, chrY of the reference and the published calls
        run: |
          set -euo pipefail
          . ./versions.env
          D="${RUNNER_TEMP}/yb"; G="${D}/genome"
          mkdir -p "${G}/reference"
          echo "D=${D}" >> "$GITHUB_ENV"
          echo "G=${G}" >> "$GITHUB_ENV"
          scripts/setup.sh --yleaf-data "$G"
          curl -fsSL --retry 5 -o "${D}/published.txt" "$Y_CALLS"
          echo "${Y_CALLS_SHA256}  ${D}/published.txt" | sha256sum -c
          curl -fsSL --retry 5 -o "${D}/hc.index" "$Y_HC_INDEX"
          echo "${Y_HC_INDEX_SHA256}  ${D}/hc.index" | sha256sum -c
          # The image has no CA bundle: htslib reads the runner's.
          docker run --rm -u "$(id -u):$(id -g)" -v /etc/ssl/certs:/etc/ssl/certs:ro -v "${G}/reference:/r" \
            "$SAMTOOLS_IMAGE" sh -c 'samtools faidx "$1" chrY > /r/chrY.fa && samtools faidx /r/chrY.fa' _ "$Y_REF"
          m5=$(docker run --rm -v "${G}/reference:/r:ro" "$SAMTOOLS_IMAGE" samtools dict /r/chrY.fa | grep -o 'M5:[0-9a-f]*')
          [ "$m5" = "M5:${Y_REF_CHRY_MD5}" ] || { echo "chrY of ${Y_REF} has ${m5}, not M5:${Y_REF_CHRY_MD5}"; exit 1; }

      - name: Step 37 on each man's chrY, from his 30x CRAM
        env:
          SAMPLES: ${{ inputs.y_samples }}
        run: |
          set -euo pipefail
          . ./versions.env
          export GENOME_DIR="$G" REF_FASTA=reference/chrY.fa
          read -ra want <<< "$(printf '%s' "$SAMPLES" | tr ',\r\n' '   ')"
          [ "${#want[@]}" -ge 3 ] || { echo "y_samples: name 3 men or more (the red control hands each man's calls to another)"; exit 1; }
          # The red control hands each man the calls of the man half the list
          # away. It can fail only when most of those pairs sit on different
          # lines, so check that on the tree before any CRAM is read: each
          # man's published branch, then his partner's against it.
          TREE="${G}/reference/yleaf-${YLEAF_DATA_VERSION}/data/ytree/current_tree.json"
          printf 'sample\tpublished\ttool\tcall\n' > "${D}/pub.tsv"
          for s in "${want[@]}"; do
            [[ "$s" =~ ^(HG|NA)[0-9]{5}$ ]] || { echo "y_samples: '${s}' is not a 1000 Genomes sample id"; exit 1; }
            pub=$(awk -v s="$s" '$1 == s {print $3}' "${D}/published.txt")
            [ -n "$pub" ] || { echo "${s}: no published call"; exit 1; }
            printf '%s\t%s\tpublished\t\n' "$s" "$pub" >> "${D}/pub.tsv"
          done
          bin/og dev evidence y-bench "$TREE" "${D}/pub.tsv" "${D}/pub.out.tsv" 0 > /dev/null
          awk -F'\t' -v OFS='\t' 'NR == 1 {print "sample", "published", "tool", "call"; next} {s[++n] = $1; p[n] = $2; b[n] = $5}
            END {for (i = 1; i <= n; i++) print s[i], p[i], "partner", b[(i - 1 + int(n / 2)) % n + 1]}' "${D}/pub.out.tsv" > "${D}/partner.tsv"
          bin/og dev evidence y-bench "$TREE" "${D}/partner.tsv" "${D}/partner.out.tsv" 0 > /dev/null
          awk -F'\t' -v min="$Y_MIN" 'NR > 1 {n++; if ($7 == "exact" || $7 == "below" || $7 == "ancestor") {k++; print "y_samples: " $1 " (" $2 ") is on one line with his partner, " $6}}
            END {if (k / n >= min) {printf "y_samples: %d of %d men share a line with the man whose calls the red control hands them; name men from different haplogroups\n", k, n; exit 1}}' "${D}/partner.out.tsv"
          # col FILE NAME: the value of column NAME in the one data row of FILE
          col() { awk -F'\t' -v n="$2" 'NR == 1 {for (i = 1; i <= NF; i++) c[$i] = i; next} NR == 2 {print $c[n]}' "$1"; }
          # slice URL MAN: MAN's chrY reads from his CRAM at URL, as a BAM with
          # its index. EBI fails a read now and then (a .crai that does not
          # parse, a region that still fails after htslib's own reconnects),
          # so try 4 times, 1, 2 and 4 minutes apart, then stop the job. Each
          # try starts clean: samtools keeps the .crai it fetched in /g and
          # would read a bad copy again. A retry reads the same file again and
          # nothing else: the calls and the gate below do not change.
          slice() {
            local crai="${G}/${1##*/}.crai" bam="${G}/$2/aligned/$2_sorted.bam" n
            for n in 1 2 3 4; do
              rm -f "$crai" "$bam" "${bam}.bai"
              if docker run --rm -u "$(id -u):$(id -g)" -v /etc/ssl/certs:/etc/ssl/certs:ro -v "${G}:/g" -w /g "$SAMTOOLS_IMAGE" \
                sh -c 'samtools view -b -T reference/chrY.fa -o "$2/aligned/$2_sorted.bam" "$1" chrY && samtools index "$2/aligned/$2_sorted.bam"' \
                _ "$1" "$2"; then
                rm -f "$crai"
                return 0
              fi
              [ "$n" -lt 4 ] || break
              echo "::warning::$2: reading chrY from $1 failed (try $n of 4); next try in $((60 << (n - 1))) s"
              sleep $((60 << (n - 1)))
            done
            echo "::error::$2: reading chrY from $1 failed 4 times; no calls are made for him, so the job stops"
            return 1
          }
          printf 'sample\tpublished\ttool\tcall\n' > "${D}/calls.tsv"
          for s in "${want[@]}"; do
            pub=$(awk -v s="$s" '$1 == s {print $3}' "${D}/published.txt")
            url=$(awk -F'\t' -v s="$s" '$10 == s {print $1}' "${D}/hc.index" | sed 's#^ftp://#https://#')
            [ -n "$pub" ] && [ -n "$url" ] || { echo "${s}: no published call or no 30x CRAM"; exit 1; }
            mkdir -p "${G}/${s}/aligned" "${G}/${s}/indexcov"
            slice "$url" "$s"
            # A chrY slice has no autosomes for indexcov to read the sex from:
            # the men are men in the 1000 Genomes panel, so the row says male.
            printf '#family_id\tsample_id\tpaternal_id\tmaternal_id\tsex\tphenotype\tCNchrX\tCNchrY\n%s\t%s\t-9\t-9\t1\t-9\t1.0\t1.0\n' \
              "$s" "$s" > "${G}/${s}/indexcov/indexcov-indexcov.ped"
            scripts/37-y-haplogroup.sh "$s"
            O="${G}/${s}/y_haplogroup"
            printf '%s\t%s\tYleaf %s\t%s\n' "$s" "$pub" "$YLEAF_DATA_VERSION" "$(col "${O}/${s}_y_haplogroup.txt" Hg)" >> "${D}/calls.tsv"
            printf '%s\t%s\tog y tree-place\t%s\n' "$s" "$pub" "$(col "${O}/${s}_y_tree.txt" Hg)" >> "${D}/calls.tsv"
            rm -rf "${G:?}/${s}"
          done
          cat "${D}/calls.tsv"

      - name: The calls against the published ones (the gate), and the red control
        run: |
          set -euo pipefail
          . ./versions.env
          TREE="${G}/reference/yleaf-${YLEAF_DATA_VERSION}/data/ytree/current_tree.json"
          {
            echo "### Y placement against Poznik et al. 2016 (YFull YTree ${YTREE_VERSION})"
            echo ""
            bin/og dev evidence y-bench "$TREE" "${D}/calls.tsv" "${D}/bench.tsv" "$Y_MIN"
            echo ""
            echo "Gate: every tool puts at least ${Y_MIN} of the men on the published branch or below it."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          # Red control: each tool's calls handed to the man half the list
          # away must fail the gate, and fail it as the gate.
          awk -F'\t' -v OFS='\t' 'NR == 1 {print; next} {s[$3, ++n[$3]] = $1; p[$3, n[$3]] = $2; c[$3, n[$3]] = $4; if (!($3 in seen)) {seen[$3]; t[++k] = $3}}
            END {for (j = 1; j <= k; j++) {m = n[t[j]]; for (i = 1; i <= m; i++) print s[t[j], i], p[t[j], i], t[j], c[t[j], (i - 1 + int(m / 2)) % m + 1]}}' \
            "${D}/calls.tsv" > "${D}/rotated.tsv"
          if bin/og dev evidence y-bench "$TREE" "${D}/rotated.tsv" "${D}/rotated.out.tsv" "$Y_MIN" 2> "${D}/rotated.err"; then
            echo "red control: the rotated calls passed the gate"; exit 1
          fi
          cat "${D}/rotated.err"
          grep -q '^og dev evidence: y-bench gate: ' "${D}/rotated.err" || { echo "red control: failed, but not on the gate"; exit 1; }

      - name: Upload the calls and their results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: y-benchmark
          path: |
            ${{ env.D }}/calls.tsv
            ${{ env.D }}/bench.tsv
          if-no-files-found: ignore

  lpa-benchmark:
    if: inputs.lpa_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build og as scripts/setup.sh --og does (og dev evidence)
        run: |
          scripts/setup.sh --og
          rust/og.sh check --required

      - name: The 30x index and chr6 of the reference the CRAMs were aligned to
        run: |
          set -euo pipefail
          . ./versions.env
          D="${RUNNER_TEMP}/lpa"; G="${D}/genome"
          mkdir -p "${G}/reference" "${D}/rows" "${D}/unread" "${D}/logs"
          echo "D=${D}" >> "$GITHUB_ENV"
          echo "G=${G}" >> "$GITHUB_ENV"
          curl -fsSL --retry 5 -o "${D}/hc.index" "$Y_HC_INDEX"
          echo "${Y_HC_INDEX_SHA256}  ${D}/hc.index" | sha256sum -c
          docker run --rm -u "$(id -u):$(id -g)" -v /etc/ssl/certs:/etc/ssl/certs:ro -v "${G}/reference:/r" \
            "$SAMTOOLS_IMAGE" sh -c 'samtools faidx "$1" chr6 > /r/chr6.fa && samtools faidx /r/chr6.fa' _ "$Y_REF"
          m5=$(docker run --rm -v "${G}/reference:/r:ro" "$SAMTOOLS_IMAGE" samtools dict /r/chr6.fa | grep -o 'M5:[0-9a-f]*')
          [ "$m5" = "M5:${LPA_REF_CHR6_MD5}" ] || { echo "chr6 of ${Y_REF} has ${m5}, not M5:${LPA_REF_CHR6_MD5}"; exit 1; }

      - name: Step 46 on each genome's reads over LPA
        env:
          SAMPLES: ${{ inputs.lpa_samples }}
        run: |
          set -euo pipefail
          . ./versions.env
          export GENOME_DIR="$G"
          bin/og dev evidence lpa-truth > "${D}/truth.tsv"
          read -ra want <<< "$(printf '%s' "$SAMPLES" | tr ',\r\n' '   ')"
          [ "${want[*]:-all}" != all ] || mapfile -t want < <(awk 'NR > 1 {print $1}' "${D}/truth.tsv")
          [ "${#want[@]}" -ge 3 ] || { echo "lpa_samples: name 3 genomes or more (the red control hands each one another's estimate)"; exit 1; }
          for s in "${want[@]}"; do
            awk -v s="$s" 'NR > 1 && $1 == s {f = 1} END {exit !f}' "${D}/truth.tsv" || { echo "lpa_samples: ${s} has no assembled count (og dev evidence lpa-truth)"; exit 1; }
          done
          # one NAME: the genome's reads over LPA (chr6:160,530,000-160,670,000, the
          # region lpa-1 reads) from its 30x CRAM (HG002: DeepVariant's 35x
          # BAM), step 46 on them, and his row of the calls. The index comes
          # first, by curl, and must be whole (a .crai is one gzip stream):
          # samtools then reads it from disk and never fetches it itself, since
          # from the runner EBI sends it slowly and cuts it now and then. The
          # slice must be a whole BAM (samtools quickcheck). EBI fails a read
          # now and then: 4 tries, 1, 2 and 4 minutes apart; a bad index is
          # deleted and fetched again. A retry reads the same file again and
          # nothing else. A genome still not read is marked in unread/; a
          # genome with neither a row nor that mark failed in step 46.
          one() {
            local s=$1 url ix n bam="${G}/$1/aligned/$1_sorted.bam"
            if [ "$s" = HG002 ]; then url=$LPA_HG002_BAM; ix=bai; else
              url=$(awk -F'\t' -v s="$s" '$10 == s {print $1}' "${D}/hc.index" | sed 's#^ftp://#https://#')
              ix=crai
            fi
            [ -n "$url" ] || { echo "${s}: no 30x reads in the index"; return 1; }
            mkdir -p "${G}/${s}/aligned"
            for n in 1 2 3 4; do
              rm -f "$bam" "${bam}.bai"
              if { [ -s "${G}/${s}/reads.${ix}" ] ||
                   curl -fsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 -o "${G}/${s}/reads.${ix}" "${url}.${ix}"; } &&
                 { [ "$ix" = bai ] || gzip -t "${G}/${s}/reads.${ix}"; } &&
                 docker run --rm -u "$(id -u):$(id -g)" -v /etc/ssl/certs:/etc/ssl/certs:ro -v "${G}:/g" -w "/g/${s}" "$SAMTOOLS_IMAGE" \
                   sh -c 'samtools view -b -T /g/reference/chr6.fa -o "aligned/$2_sorted.bam" -X "$1" "reads.$3" chr6:160530000-160670000 &&
                     samtools quickcheck "aligned/$2_sorted.bam" && samtools index "aligned/$2_sorted.bam"' \
                   _ "$url" "$s" "$ix"; then
                break
              fi
              # A whole .crai is kept for the next try; anything else is fetched again.
              if [ "$ix" = bai ] || ! gzip -t "${G}/${s}/reads.${ix}" 2> /dev/null; then rm -f "${G}/${s}/reads.${ix}"; fi
              [ "$n" -lt 4 ] || { echo "::warning::${s}: reading LPA from ${url} failed 4 times; left out"; : > "${D}/unread/${s}"; return 1; }
              echo "::warning::${s}: reading LPA from ${url} failed (try $n of 4); next try in $((60 << (n - 1))) s"
              sleep $((60 << (n - 1)))
            done
            scripts/46-lpa.sh "$s" > "${D}/logs/${s}.log" 2>&1 || { cat "${D}/logs/${s}.log"; return 1; }
            awk -F'\t' -v OFS='\t' -v s="$s" '{v[$1] = $2} END {print s, v["kiv2_copies"], v["ci95_low"], v["ci95_high"]}' \
              "${G}/${s}/lpa/${s}_lpa_kiv2.tsv" > "${D}/rows/${s}.tsv"
            rm -rf "${G:?}/${s}"
          }
          export -f one
          export D G LPA_HG002_BAM SAMTOOLS_IMAGE
          # Three genomes at a time: the reads are a few MB each, the wait is
          # EBI's, and six streams at once got indexes cut short.
          # shellcheck disable=SC2016  # $1 belongs to the inner bash
          printf '%s\n' "${want[@]}" | xargs -P 3 -I{} bash -c 'one "$1"' _ {} || true
          printf 'sample\tkiv2_copies\tci95_low\tci95_high\n' > "${D}/calls.tsv"
          unread=()
          for s in "${want[@]}"; do
            if [ -s "${D}/rows/${s}.tsv" ]; then cat "${D}/rows/${s}.tsv" >> "${D}/calls.tsv"
            elif [ -e "${D}/unread/${s}" ]; then unread+=("$s")
            else echo "::error::${s}: no row and not marked unread (step 46 failed on its reads)"; exit 1
            fi
          done
          cat "${D}/calls.tsv"
          read_n=$(( ${#want[@]} - ${#unread[@]} ))
          echo "${read_n} of ${#want[@]} genomes read; not read: ${unread[*]:-none}" | tee "${D}/read.txt"
          awk -v r="$read_n" -v n="${#want[@]}" -v m="$LPA_READ_MIN" 'BEGIN {exit !(r >= 3 && r >= m * n)}' ||
            { echo "::error::only ${read_n} of ${#want[@]} genomes were read; the gate needs ${LPA_READ_MIN} of them, and 3 at least"; exit 1; }

      - name: The intervals against the assembled counts (the gate), and the red control
        run: |
          set -euo pipefail
          {
            echo "### LPA KIV-2 against assembled genomes"
            echo ""
            bin/og dev evidence lpa-bench "${D}/calls.tsv" "${D}/bench.tsv" "$LPA_MIN"
            echo ""
            echo "Gate: the interval holds the assembled count in at least ${LPA_MIN} of the genomes read."
            echo "Genomes: $(cat "${D}/read.txt")."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          # Red control: each genome gets the estimate and interval of the
          # genome half the list away; that must fail the gate, as the gate.
          awk -F'\t' -v OFS='\t' 'NR == 1 {print; next} {s[++n] = $1; r[n] = $2 OFS $3 OFS $4}
            END {for (i = 1; i <= n; i++) print s[i], r[(i - 1 + int(n / 2)) % n + 1]}' "${D}/calls.tsv" > "${D}/rotated.tsv"
          if bin/og dev evidence lpa-bench "${D}/rotated.tsv" "${D}/rotated.out.tsv" "$LPA_MIN" > /dev/null 2> "${D}/rotated.err"; then
            echo "red control: the rotated estimates passed the gate"; exit 1
          fi
          cat "${D}/rotated.err"
          grep -q '^og dev evidence: lpa-bench gate: ' "${D}/rotated.err" || { echo "red control: failed, but not on the gate"; exit 1; }

      - name: Upload the calls and their results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lpa-benchmark
          path: |
            ${{ env.D }}/calls.tsv
            ${{ env.D }}/bench.tsv
          if-no-files-found: ignore
