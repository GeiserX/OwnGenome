name: Docs

# The repository had no Pages site before this workflow. Pages is switched on
# once with
# `gh api -X POST repos/GeiserX/OwnGenome/pages -f build_type=workflow`,
# so the source is "GitHub Actions" and there is no gh-pages branch. Until
# then the deploy job fails, which is the test that the switch happened.
#
# Pull requests that touch the docs run the strict build and the site check,
# so a broken link, a missing page or an unreachable page fails the check
# instead of reaching the site. A push to main deploys, and only after the
# same build has passed.
#
# The site is published as a Pages artifact: no gh-pages branch, no
# `contents: write`, and one artifact is the whole site.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
      # Add every file a page includes with pymdownx.snippets (for example
      # docker-compose.yml, .env.example): a change to it must rebuild the
      # site, and a rename must fail the build.
      # og live demo builds the live-site demo at /demo/ from these files.
      # assets/** because og report render also reads the gene and rule tables there.
      - 'assets/**'
      - 'bin/**'
      - 'tests/demo/**'
      - 'tests/fixtures/live/**'
      - 'tests/browser/live_demo*.rs'
      # og writes the demo sample itself (og dev demo-sample), with its CPIC
      # table (og pgx cpic-report) and its mosaic rows (og qc sex-loss), and
      # builds the demo's Figure 1, the genome map (og map build).
      - 'rust/**'
      - 'tests/fixtures/map/**'
      - 'tests/og_binary.py'
  # No paths filter on pull requests, on purpose: a check skipped by a path
  # filter stays Pending and blocks the merge once it is a required check
  # (repos.md step 5 makes green checks required). The build takes seconds.
  pull_request:
  workflow_dispatch:

# One run at a time per ref, never cancelled. GitHub keeps one running and one
# pending run per group, and a run that joins later replaces the pending one.
# Runs join in the order GitHub queues them, which is not promised to be push
# order, so a newer push is likely, not certain, to deploy last.
# Locking only the deploy job is not enough: an older push whose build finishes
# later could deploy last and publish a stale site. Pull requests get their own group.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (strict)
    # Public repo: GitHub-hosted runners are free and unlimited here, and the
    # job runs on pull requests, so it must never touch a self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes; a persisted token is readable by pip and by the build.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          # pip's download cache only. Zensical's own build cache (.cache/) is
          # never kept between runs: its docs advise against it on CI, and
          # --clean below starts from nothing anyway.
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install dependencies
        run: pip install -r docs/requirements-docs.txt

      # zensical.toml sets `strict = true`; the flag here keeps the build strict
      # even if someone removes that line. `python -m zensical`, never the bare
      # `zensical` command: it puts the repo root on sys.path, which the awesome
      # lists' Markdown extension needs, and every repo builds the same way.
      - name: Build
        run: python -m zensical build --clean --strict

      # og (rust/, docs/rust.md): og dev demo-sample writes the demo sample,
      # running the og verbs of the steps it stands in for (step 27's
      # og pgx cpic-report, step 33's og qc sex-loss and the rest), and
      # og map build writes the genome map's documents.
      - name: Install the toolchain rust/rust-toolchain.toml pins
        working-directory: rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - name: Build og
        working-directory: rust
        run: |
          OG_TREE_HASH=$(./og.sh tree-hash) cargo build --release --locked -p og
          echo "OG=${PWD}/target/release/og" >> "$GITHUB_ENV"

      # What the strict build does not check: a page in no nav entry, a nav
      # entry for a missing file, a missing image, a /rooted link, a raw <title>
      # in a page (og dev site-check, rust/crates/og-dev/src/site_check.rs; its
      # tests plant each fault in rust/crates/og-dev/tests/site_check.rs).
      - name: Check the built site
        run: |
          "$OG" dev site-check site

      # Build the invented runs and their replay after the documentation check.
      - name: Add the live-site demo
        run: |
          "$OG" dev demo-events --check
          "$OG" live demo --out site/demo
          test -s site/demo/runs/DEMO-001/frames.json
          for r in DEMO-001 DEMO-002 DEMO-003; do test -s "site/demo/runs/${r}/map.json"; done

      # Keep desktop and phone views of the map as a build artifact.
      - name: Screenshots of the genome map
        working-directory: rust
        run: |
          OG_DEMO_SITE="$GITHUB_WORKSPACE/site/demo" OG_DEMO_SCREENS="$RUNNER_TEMP/map-screens" \
            cargo test --release --locked -p og-browser --test live_demo capture_map_screens -- --ignored

      - name: Upload the map screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-screens
          path: ${{ runner.temp }}/map-screens/*.png
          if-no-files-found: error
          retention-days: 14

      # Push to main only: workflow_dispatch can be run on any branch, and the
      # push filter above does not apply to it. Same line as docs-pages-helm.yml.
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # Runs on push to main only, after the build job has passed.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
